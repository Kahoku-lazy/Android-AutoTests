name: ✨ 功能建议
description: 提议新功能或改进（拿不准的想法可先去 Discussions 讨论）
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提示：本期产品边界见 README「产品边界」一节（iOS / Web / API 执行引擎、设备云、多团队隔离等暂不在范围内）。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景与痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你期望平台怎么做；涉及哪些模块（设备 / 用例 / 任务 / 助手 / 知识库 / 运营后台…）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 改动规模预估
      options:
        - 小改进（单模块内）
        - 中等功能（跨模块）
        - 大功能（需要 OpenSpec 立项）
        - 不确定
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue / Discussions，没有重复
          required: true