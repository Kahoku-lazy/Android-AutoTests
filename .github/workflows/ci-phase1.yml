name: CI Phase 1 — Build & Security

on:
  push:
    branches: [main, Kahoku, Aaron, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, Kahoku]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════
  # Job 1: Python 后端编译 + 格式检查
  # ═══════════════════════════════════════════
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # 1. Django 系统检查（配置完整性）
      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-django-check-key-not-for-prod
        run: |
          python manage.py check --deploy 2>&1 || true
          python manage.py check

      # 2. Python 代码格式（ruff format）
      - name: Ruff format check
        run: ruff format --check apps/ agentscope_service/ config/ gateway/ shared/ models/

      # 3. Python lint（ruff check）
      - name: Ruff lint
        run: ruff check apps/ agentscope_service/ config/ gateway/ shared/ models/

  # ═══════════════════════════════════════════
  # Job 2: 前端编译 + 格式检查
  # ═══════════════════════════════════════════
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # 4. 前端编译
      - name: Vite build
        run: cd frontend && npx vite build

      # 5. JS/Vue/CSS 格式
      - name: Prettier check
        run: cd frontend && npx prettier --check "src/**/*.{vue,js,css}"

  # ═══════════════════════════════════════════
  # Job 3: 硬编码凭据安全扫描
  # ═══════════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Scan hardcoded credentials
        run: |
          echo "╔══════════════════════════════════╗"
          echo "║  硬编码凭据安全扫描             ║"
          echo "╚══════════════════════════════════╝"
          echo ""
          VIOLATIONS=0

          # ── 规则 1: 硬编码密码 ──
          echo "▶ 检查：硬编码密码 (password = '...')"
          PASSWORD_MATCHES=$(grep -rnE "password\s*=\s*'[^']+'" apps/ config/ gateway/ shared/ models/ agentscope_service/ \
            --include="*.py" 2>/dev/null | grep -v "password\s*=\s*''" | grep -v "PASSWORD" || true)
          if [ -n "$PASSWORD_MATCHES" ]; then
            echo "❌ 发现硬编码密码："
            echo "$PASSWORD_MATCHES"
            echo ""
            VIOLATIONS=1
          else
            echo "  ✅ 未发现"
          fi

          # ── 规则 2: 明文 API Key ──
          echo "▶ 检查：明文 API Key (api_key = 'sk-...')"
          APIKEY_MATCHES=$(grep -rnE "(api_key|apikey|API_KEY)\s*=\s*'sk-[A-Za-z0-9]+'" \
            apps/ agentscope_service/ config/ gateway/ shared/ --include="*.py" 2>/dev/null || true)
          if [ -n "$APIKEY_MATCHES" ]; then
            echo "❌ 发现明文 API Key："
            echo "$APIKEY_MATCHES"
            echo ""
            VIOLATIONS=1
          else
            echo "  ✅ 未发现"
          fi

          # ── 规则 3: 常见默认密码 ──
          echo "▶ 检查：常见默认密码 (admin123 / password 等)"
          DEFAULT_PWD=$(grep -rnE \
            "'admin123'|'autotests2026'|'password'\s*[:=]" \
            apps/ config/ gateway/ shared/ --include="*.py" 2>/dev/null \
            | grep -v "PASSWORD" | grep -v "test" | grep -v "__pycache__" || true)
          if [ -n "$DEFAULT_PWD" ]; then
            echo "⚠️  发现疑似默认密码（请人工确认）："
            echo "$DEFAULT_PWD"
          else
            echo "  ✅ 未发现"
          fi

          # ── 规则 4: Token/Secret 硬编码 ──
          echo "▶ 检查：硬编码 Token/Secret"
          TOKEN_MATCHES=$(grep -rnE "(secret_key|SECRET_KEY|private_key)\s*=\s*'[^']+'" \
            apps/ config/ gateway/ shared/ --include="*.py" 2>/dev/null | grep -v "os.environ" | grep -v "getenv" || true)
          if [ -n "$TOKEN_MATCHES" ]; then
            echo "❌ 发现硬编码密钥/Token："
            echo "$TOKEN_MATCHES"
            echo ""
            VIOLATIONS=1
          else
            echo "  ✅ 未发现"
          fi

          # ── 规则 5: 前端硬编码凭据 ──
          echo "▶ 检查：前端代码中的硬编码凭据"
          FRONTEND_MATCHES=$(grep -rnE \
            "(api_key|password|token|secret)\s*[=:]\s*['\"]\\w{8,}" \
            frontend/src/ --include="*.js" --include="*.vue" 2>/dev/null \
            | grep -v "node_modules" | grep -v ".test." || true)
          if [ -n "$FRONTEND_MATCHES" ]; then
            echo "❌ 前端发现疑似硬编码凭据："
            echo "$FRONTEND_MATCHES"
            echo ""
            VIOLATIONS=1
          else
            echo "  ✅ 未发现"
          fi

          echo ""
          if [ $VIOLATIONS -eq 1 ]; then
            echo "╔══════════════════════════════════╗"
            echo "║  ❌ 安全扫描失败               ║"
            echo "║  请将硬编码凭据替换为:         ║"
            echo "║  os.environ.get('KEY', '')      ║"
            echo "╚══════════════════════════════════╝"
            exit 1
          fi
          echo "╔══════════════════════════════════╗"
          echo "║  ✅ 安全扫描通过               ║"
          echo "╚══════════════════════════════════╝"

  # ═══════════════════════════════════════════
  # Job 4: 模块边界检查（防火墙 #1 + #2）
  # ═══════════════════════════════════════════
  boundary-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Module boundary check
        env:
          DJANGO_SECRET_KEY: ci-boundary-check-key-not-for-prod
        run: |
          echo "╔══════════════════════════════════╗"
          echo "║  模块边界检查                   ║"
          echo "║  防火墙 #1: 跨模块内部实现 import  ║"
          echo "║  防火墙 #2: 跨模块 ORM 直接写入   ║"
          echo "╚══════════════════════════════════╝"
          echo ""
          python tools/gen_arch_stats.py --check-boundaries

  # ═══════════════════════════════════════════
  # Job 5: 前端质量检查（文件体积 + 硬编码数据）
  # ═══════════════════════════════════════════
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Vue file sizes
        run: |
          echo "╔══════════════════════════════════╗"
          echo "║  前端文件体积检查 (<500行)      ║"
          echo "╚══════════════════════════════════╝"
          echo ""
          python tools/gen_arch_stats.py --check-frontend

      - name: Check for hardcoded mock data
        run: |
          echo "▶ 检查：硬编码假数据 (ref([{...id:...]))"
          if grep -rnE "ref\(\s*\[\s*\{[^}]*id:" frontend/src/modules/ --include="*.vue" 2>/dev/null; then
            echo "❌ 发现前端硬编码假数据，请从 API 获取"
            exit 1
          fi
          echo "  ✅ 未发现"

      - name: Check large inline styles
        run: |
          echo "▶ 检查：120行以上的内联样式（建议外置 CSS）"
          python3 -c "
          import re, sys
          issues = []
          for f in sys.argv[1:]:
              with open(f) as fh:
                  content = fh.read()
              m = re.search(r'<style[^>]*>', content)
              if m:
                  start = content[:m.start()].count('\n')
                  end = content[m.end():].find('</style>')
                  if end >= 0:
                      style_end = start + content[m.end():m.end()+end].count('\n') + 1
                      size = style_end - start
                      if size > 120:
                          issues.append(f'{f}: {size}行内联样式 (建议外置)')
          if issues:
              print('⚠️  以下文件内联样式过大：')
              for i in issues: print(f'  {i}')
          " frontend/src/modules/**/*.vue 2>/dev/null || true
          echo "  ✅ 检查完成"
