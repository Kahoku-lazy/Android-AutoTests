name: CI

# 判定在 utils/check_gates.py。本文件只负责装依赖并点名门禁，
# 不再把同一条命令抄进 YAML。新增检查只改 build_gates()，再把名字加到对应 job。

on:
  push:
    branches: [Kahoku]
  pull_request:
    branches: [Kahoku]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Python quality gates
        env:
          DJANGO_SECRET_KEY: ci-not-for-prod
          # 占位值。检查不调用模型；名字与 models.py 的三把钥匙一致。
          DEEPSEEK_API_KEY: ci-placeholder
          DASHSCOPE_API_KEY: ci-placeholder
          GOVEE_API_KEY: ci-placeholder
        run: >
          python utils/check_gates.py --only
          django-check,ruff-format,ruff-lint,pytest-collect,
          openapi-schema,openapi-coverage,
          ruff-engines-format,ruff-engines-lint,
          silent-except,business-asset,engines-agents-retirement,
          single-agent-constructor,
          cred-password,cred-apikey,cred-secret,
          boundary,vue-file-size,mock-data

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend quality gates
        env:
          DJANGO_SECRET_KEY: ci-not-for-prod
        run: >
          python utils/check_gates.py --only
          vitest,vite-build,prettier,eslint,dashed-whitelist,
          vue-tsc,prettier-ts,style-gates,cred-frontend
