<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>仪表盘 · Android-AutoTests</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');
  :root {
    --bg-gradient: linear-gradient(135deg,#fdfbfb 0%,#ebedee 100%);
    --glass-bg: rgba(255,255,255,0.45);
    --glass-border: rgba(255,255,255,0.6);
    --text-primary: #4a4e69;
    --text-secondary: #9a8c98;
    --accent-pink: #ffafcc;
    --accent-blue: #a2d2ff;
    --accent-green: #bde0fe;
    --side-bg: rgba(74,78,105,0.85);
    --shadow: 0 8px 32px 0 rgba(31,38,135,0.07);
    --side-w: 220px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Quicksand',sans-serif; min-height:100vh; display:flex; background:linear-gradient(45deg,#ffc8dd,#bde0fe,#a2d2ff); background-size:200% 200%; animation:gradientBG 15s ease infinite; position:relative; overflow:hidden; }
  @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .blob { position:absolute; border-radius:50%; filter:blur(60px); z-index:0; opacity:.8; }
  .blob-1 { top:-10%; left:-10%; width:400px; height:400px; background:#ffafcc; }
  .blob-2 { bottom:-10%; right:-10%; width:300px; height:300px; background:#a2d2ff; }
  .blob-3 { top:40%; left:60%; width:250px; height:250px; background:#e2ece9; }
  .sidebar { width:var(--side-w); background:var(--side-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:relative; z-index:1; border-right:1px solid rgba(255,255,255,0.3); }
  .sidebar-brand { padding:24px 20px 16px; font-size:18px; font-weight:700; letter-spacing:-0.3px; border-bottom:1px solid rgba(255,255,255,0.15); }
  .sidebar-brand .ver { font-size:10px; font-weight:500; color:rgba(255,255,255,0.6); display:block; margin-top:3px; letter-spacing:1px; }
  .sidebar-nav { flex:1; padding:12px 0; }
  .sidebar-nav a { display:flex; align-items:center; gap:10px; padding:12px 20px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:13px; font-weight:500; transition:all .2s; border-left:3px solid transparent; }
  .sidebar-nav a:hover { background:rgba(255,255,255,0.08); color:#fff; }
  .sidebar-nav a.active { background:rgba(255,255,255,0.12); color:#fff; font-weight:600; border-left-color:#ffafcc; }
  .sidebar-nav .nav-icon { font-size:15px; width:22px; text-align:center; opacity:.5; }
  .sidebar-nav a.active .nav-icon { opacity:1; }
  .sidebar-footer { padding:14px 20px; border-top:1px solid rgba(255,255,255,0.15); font-size:12px; color:rgba(255,255,255,0.6); }
  .sidebar-footer span { color:rgba(255,255,255,0.8); }
  .main { flex:1; padding:32px 36px; overflow-y:auto; position:relative; z-index:1; }
  h2 { font-size:22px; font-weight:700; color:var(--text-primary); letter-spacing:-0.3px; margin-bottom:20px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .stat { background:var(--glass-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-radius:20px; border:1px solid var(--glass-border); padding:24px; box-shadow:var(--shadow); transition:all .3s; }
  .stat:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(31,38,135,0.1); }
  .stat-num { font-size:32px; font-weight:700; color:var(--text-primary); }
  .stat-label { font-size:13px; color:var(--text-secondary); margin-top:6px; font-weight:500; }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  .panel { background:var(--glass-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-radius:20px; border:1px solid var(--glass-border); padding:24px; box-shadow:var(--shadow); }
  .panel h3 { font-size:15px; font-weight:600; color:var(--text-primary); margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid rgba(74,78,105,0.1); }
  .list-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(74,78,105,0.06); font-size:13px; color:var(--text-primary); }
  .list-item:last-child { border-bottom:none; }
  .list-item .meta { color:var(--text-secondary); font-size:11px; display:flex; align-items:center; gap:8px; }
  .badge { padding:6px 14px; border-radius:50px; font-size:11px; font-weight:700; letter-spacing:.3px; backdrop-filter:blur(4px); }
  .badge-pass { background:rgba(184,232,198,0.6); color:#1a5c2a; border:1px solid rgba(184,232,198,0.8); }
  .badge-fail { background:rgba(255,192,203,0.6); color:#7a1c2b; border:1px solid rgba(255,192,203,0.8); }
  .badge-run { background:rgba(162,210,255,0.6); color:#1c4a7a; border:1px solid rgba(162,210,255,0.8); }
  .btn { padding:10px 20px; border-radius:50px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Quicksand',sans-serif; transition:all .2s; border:1px solid rgba(74,78,105,0.2); background:rgba(255,255,255,0.6); color:var(--text-primary); }
  .btn:hover { background:rgba(255,255,255,0.9); }
  .btn-fill { background:var(--text-primary); color:#fff; border-color:var(--text-primary); }
  .btn-fill:hover { opacity:.9; }
  .actions { display:flex; flex-direction:column; gap:10px; }
</style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
<div class="sidebar">
  <div class="sidebar-brand">AutoTests<span class="ver">v2.0 · Glass</span></div>
  <div class="sidebar-nav">
    <a class="active" href="dashboard.html"><span class="nav-icon">◻</span>仪表盘</a>
    <a href="devices.html"><span class="nav-icon">◷</span>设备管理</a>
    <a href="elements.html"><span class="nav-icon">◇</span>元素定位</a>
    <a href="cases.html"><span class="nav-icon">▣</span>测试用例</a>
    <a href="runner.html"><span class="nav-icon">▶</span>执行引擎</a>
    <a href="reports.html"><span class="nav-icon">▤</span>测试报告</a>
    <a href="#" style="opacity:0.45;pointer-events:none;margin-top:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:14px;"><span class="nav-icon">●</span>AgentScope</a>
  </div>
  <div class="sidebar-footer"><span>admin</span> · <a href="login.html" style="color:rgba(255,255,255,0.5);">退出</a></div>
</div>
<div class="main">
  <h2>Govee Home 测试</h2>
  <div class="stats">
    <div class="stat"><div class="stat-num">2</div><div class="stat-label">在线设备</div></div>
    <div class="stat"><div class="stat-num">45</div><div class="stat-label">测试用例</div></div>
    <div class="stat"><div class="stat-num">12</div><div class="stat-label">今日执行</div></div>
    <div class="stat"><div class="stat-num" style="color:#1a5c2a;">97.8%</div><div class="stat-label">通过率</div></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>最近执行</h3>
      <div class="list-item"><span>蓝牙连接回归测试</span><span class="meta"><span class="badge badge-pass">PASS</span>15:32</span></div>
      <div class="list-item"><span>设备配对流程</span><span class="meta"><span class="badge badge-pass">PASS</span>14:55</span></div>
      <div class="list-item"><span>固件更新冒烟</span><span class="meta"><span class="badge badge-fail">FAIL</span>13:20</span></div>
      <div class="list-item"><span>UI 元素压力测试</span><span class="meta"><span class="badge badge-run">RUNNING</span>85/100</span></div>
      <div class="list-item"><span>登录页验证</span><span class="meta"><span class="badge badge-pass">PASS</span>昨天</span></div>
    </div>
    <div class="panel">
      <h3>快捷操作</h3>
      <div class="actions">
        <button class="btn btn-fill" onclick="location.href='elements.html'">开始元素定位</button>
        <button class="btn" onclick="location.href='runner.html'">执行测试</button>
        <button class="btn" onclick="location.href='cases.html'">新建用例</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
