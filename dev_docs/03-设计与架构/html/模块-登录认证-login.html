<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 · Android-AutoTests</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');
  :root {
    --glass-bg: rgba(255,255,255,0.45); --glass-border: rgba(255,255,255,0.6);
    --text-primary: #4a4e69; --text-secondary: #9a8c98;
    --shadow: 0 8px 32px 0 rgba(31,38,135,0.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Quicksand',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(45deg,#ffc8dd,#bde0fe,#a2d2ff); background-size:200% 200%; animation:gradientBG 15s ease infinite; overflow:hidden; }
  @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .blob { position:absolute; border-radius:50%; filter:blur(60px); z-index:0; opacity:.8; }
  .blob-1 { top:-10%; left:-10%; width:400px; height:400px; background:#ffafcc; }
  .blob-2 { bottom:-10%; right:-10%; width:300px; height:300px; background:#a2d2ff; }
  .blob-3 { top:40%; left:60%; width:250px; height:250px; background:#e2ece9; }
  .container { position:relative; z-index:1; background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:30px; border:1px solid var(--glass-border); box-shadow:var(--shadow); padding:48px 40px; width:420px; }
  .logo { font-size:22px; font-weight:700; color:var(--text-primary); letter-spacing:-0.5px; }
  .desc { font-size:13px; color:var(--text-secondary); margin:6px 0 32px; }
  .field { margin-bottom:18px; }
  .field label { display:block; font-size:11px; color:var(--text-secondary); font-weight:500; margin-bottom:6px; }
  .field input { width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--glass-border); font-size:14px; font-family:'Quicksand',sans-serif; background:rgba(255,255,255,0.4); color:var(--text-primary); backdrop-filter:blur(4px); }
  .field input:focus { outline:none; border-color:rgba(162,210,255,0.8); background:rgba(255,255,255,0.6); }
  .btn { width:100%; padding:14px; border-radius:50px; border:none; font-size:14px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif; background:var(--text-primary); color:#fff; transition:all .2s; margin-top:8px; }
  .btn:hover { opacity:.9; transform:translateY(-1px); }
  .links { margin-top:20px; font-size:12px; color:var(--text-secondary); text-align:center; }
  .links a { color:var(--text-primary); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
<div class="container">
  <div class="logo">AutoTests</div>
  <div class="desc">Android 移动端自动化测试平台</div>
  <div class="field"><label>用户名</label><input type="text" placeholder="admin"></div>
  <div class="field"><label>密码</label><input type="password" placeholder="······"></div>
  <button class="btn" onclick="location.href='dashboard.html'">登 录</button>
  <p class="links"><a href="#">注册账号</a> · <a href="#">忘记密码</a></p>
</div>
</body>
</html>
