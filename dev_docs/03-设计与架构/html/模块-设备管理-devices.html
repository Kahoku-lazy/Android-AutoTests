<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>设备管理 · Android-AutoTests</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');
  :root {
    --glass-bg: rgba(255,255,255,0.45); --glass-border: rgba(255,255,255,0.6);
    --text-primary: #4a4e69; --text-secondary: #9a8c98;
    --side-bg: rgba(74,78,105,0.85); --shadow: 0 8px 32px 0 rgba(31,38,135,0.07); --side-w:220px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Quicksand',sans-serif; min-height:100vh; display:flex; background:linear-gradient(45deg,#ffc8dd,#bde0fe,#a2d2ff); background-size:200% 200%; animation:gradientBG 15s ease infinite; position:relative; overflow:hidden; }
  @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .blob { position:absolute; border-radius:50%; filter:blur(60px); z-index:0; opacity:.8; }
  .blob-1 { top:-10%; left:-10%; width:400px; height:400px; background:#ffafcc; }
  .blob-2 { bottom:-10%; right:-10%; width:300px; height:300px; background:#a2d2ff; }
  .blob-3 { top:40%; left:60%; width:250px; height:250px; background:#e2ece9; }
  .sidebar { width:var(--side-w); background:var(--side-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:relative; z-index:1; border-right:1px solid rgba(255,255,255,0.3); }
  .sidebar-brand { padding:24px 20px 16px; font-size:18px; font-weight:700; letter-spacing:-0.3px; border-bottom:1px solid rgba(255,255,255,0.15); }
  .sidebar-brand .ver { font-size:10px; font-weight:500; color:rgba(255,255,255,0.6); display:block; margin-top:3px; }
  .sidebar-nav { flex:1; padding:12px 0; }
  .sidebar-nav a { display:flex; align-items:center; gap:10px; padding:12px 20px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:13px; font-weight:500; border-left:3px solid transparent; transition:all .2s; }
  .sidebar-nav a:hover { background:rgba(255,255,255,0.08); color:#fff; }
  .sidebar-nav a.active { background:rgba(255,255,255,0.12); color:#fff; font-weight:600; border-left-color:#ffafcc; }
  .sidebar-nav .nav-icon { font-size:15px; width:22px; text-align:center; opacity:.5; }
  .sidebar-nav a.active .nav-icon { opacity:1; }
  .sidebar-footer { padding:14px 20px; border-top:1px solid rgba(255,255,255,0.15); font-size:12px; color:rgba(255,255,255,0.6); }
  .main { flex:1; padding:32px 36px; overflow-y:auto; position:relative; z-index:1; }
  h2 { font-size:22px; font-weight:700; color:var(--text-primary); letter-spacing:-0.3px; margin-bottom:20px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .btn { padding:10px 20px; border-radius:50px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Quicksand',sans-serif; border:1px solid rgba(74,78,105,0.2); background:rgba(255,255,255,0.6); color:var(--text-primary); transition:all .2s; }
  .btn:hover { background:rgba(255,255,255,0.9); }
  .btn-fill { background:var(--text-primary); color:#fff; border-color:var(--text-primary); }
  .table-wrap { background:var(--glass-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-radius:20px; border:1px solid var(--glass-border); box-shadow:var(--shadow); overflow:hidden; }
  .table { width:100%; border-collapse:collapse; }
  .table th { padding:14px 18px; text-align:left; font-size:11px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; background:rgba(255,255,255,0.3); border-bottom:1px solid rgba(74,78,105,0.1); }
  .table td { padding:14px 18px; font-size:13px; color:var(--text-primary); border-bottom:1px solid rgba(74,78,105,0.06); }
  .table tr:last-child td { border-bottom:none; }
  .table tr:hover td { background:rgba(255,255,255,0.3); }
  .badge { padding:5px 14px; border-radius:50px; font-size:10px; font-weight:700; letter-spacing:.3px; }
  .s-online { background:rgba(184,232,198,0.6); color:#1a5c2a; border:1px solid rgba(184,232,198,0.8); }
  .s-busy { background:rgba(162,210,255,0.6); color:#1c4a7a; border:1px solid rgba(162,210,255,0.8); }
  .s-offline { background:rgba(255,192,203,0.6); color:#7a1c2b; border:1px solid rgba(255,192,203,0.8); }
  .btn-sm { padding:6px 14px; border-radius:50px; font-size:11px; font-weight:600; cursor:pointer; font-family:'Quicksand',sans-serif; border:1px solid rgba(74,78,105,0.2); background:rgba(255,255,255,0.5); color:var(--text-primary); transition:all .2s; }
  .btn-sm:hover { background:rgba(255,255,255,0.9); }
  .info-text { font-size:12px; color:var(--text-secondary); margin-top:12px; }
</style>
</head>
