- title: H6810 卡片页开关功能测试
  steps:
    - action: 启动 govee 应用
      assert: 前台为 govee，进入 APP 主页

    - action: 长按 H6810 卡片，页头第一行变为 ✕ / 「灵动 | 经典」/ ✓；选择经典布局， 点右上角 ✓
      assert: 样式栏消失、页头恢复标题「设备」；且卡片变为经典布局（名称在图片右侧同行、出现 ON ｜ OFF 分段）

    - action: 等待连接成功，WiFi与蓝牙任意一个连接成功即可（连接成功显示蓝色图表）
      assert: 卡片右上角出现蓝色蓝牙或 WiFi 图标，任意一个连接成功即可。

    - action: 测试 H6810 卡片页面开关功能，ON｜OFF 都要点击一次；点击成功页面返回弹窗"操作成功""
      assert: 设备日志返回开关日志（开灯事件与关灯事件）

    - action: 长按 H6810 卡片，页头第一行变为 ✕ / 「灵动 | 经典」/ ✓；选择灵动布局， 点右上角 ✓
      assert: 样式栏消失、页头恢复标题「设备」；且卡片变为灵动布局（名称在左上、图在下方、右下角圆形电源按钮）


    - action: 等待连接成功，WiFi与蓝牙任意一个连接成功即可（连接成功显示蓝色图表）
      assert: 卡片右上角出现蓝色蓝牙或 WiFi 图标，任意一个连接成功即可。

    - action: 测试 H6810 卡片页面开关功能，电源按钮蓝色表示设备开启，灰色或白色表示设备关闭；点击成功页面返回弹窗"操作成功""
      assert: 设备日志返回开关日志（开灯事件与关灯事件）

    - action: 测试 H6810 卡片页面亮度功能，亮度设置大于70%，再设置小于30%；如果亮度大于70%则先设置小于30%再设置大于70%。
      assert: 设备日志返回亮度设置成功日志（亮度设置大于70%与亮度设置小于30%）

    - action: 关闭 Govee Home APP
      assert: Govee Home APP 关闭，回到手机桌面。
      

- title: H6810 基础模式功能应用测试
  steps:
    - action: 启动 govee 应用
      assert: 前台为 govee，进入 APP 主页

    - action: 点击 H6810 卡片
      assert: 进入详情页

    - action: 测试设备开关功能，如果设备是打开状态则先关闭设备再打开。
      assert: 设备日志返回开关成功日志（开灯事件与关灯事件）

    - action: 测试设备亮度功能，亮度设置大于70%，再设置小于30%；如果亮度大于70%则先设置小于30%再设置大于70%。
      assert: 设备日志返回亮度设置成功日志（亮度设置大于70%与亮度设置小于30%）

    - action: 测试设备颜色功能，先点击颜色模式，上划页面，找到基础色标签，随机选择基础色模块下的两种颜色色块。。
      assert: 设备日志返回颜色设置成功日志（需要判断两次，颜色设置成功）

    - action: 测试设备场景功能，先点击场景模式，向下滑动页面，设置两次场景灯效；两次设置的场景标签，场景灯效不能相同（（页面中有图标的元素位置是灯效，没有图标的元素位置是场景标签）。
      assert: 设备日志返回场景设置成功日志（需要判断两次，场景设置成功）

    - action: 测试音乐场景功能，点击音乐场景，向下滑动页面，选择来自设备的拾音方法，任选两种灯效进行设置（页面中流星雨位置相似的元素就是灯效，如果没有只能上下滑动页面寻找）。
      assert: 设备日志返回音乐场景设置成功日志（需要判断两次，音乐场景设置成功）

    - action: 测试DIY场景功能，点击DIY场景，向下滑动页面，设置两种灯效（页面中我的DIY下面有图标与文字组合的元素就是灯效，如果没有只能上下滑动页面寻找）。
      assert: 设备日志返回DIY场景设置成功日志（需要判断两次，DIY场景设置成功）

    - action: 关闭 Govee Home APP
      assert: Govee Home APP 关闭，回到手机桌面。
