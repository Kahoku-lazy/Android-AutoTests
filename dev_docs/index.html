<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档索引 · Stage-Gate · Android-AutoTests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="assets/doc-portal.css">
<link rel="stylesheet" href="assets/md-viewer.css">

</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-badge">STAGE-GATE · v3</div>
      <div class="sidebar-title">项目文档索引</div>
      <div class="sidebar-meta"><a href="06-发布与复盘/文档分类方案_Stage-Gate_20260710.html">分类说明</a></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">Android-AutoTests<br>更新于 2026-07-10</div>
  </aside>

  <main class="main">
    <div class="main-header" id="main-header"></div>
    <div class="stats" id="stats-bar"></div>

    <div class="view-panel" id="dashboard-panel" data-hash="dashboard">
      <div class="kpi-row" id="kpi-row"></div>
      <div class="dash-grid">
        <div class="chart-card full">
          <div class="chart-title">各阶段文档分布 <span>MD + HTML 堆叠柱状图</span></div>
          <div class="chart-box tall" id="chart-stage-bar"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">格式占比 <span>MD vs HTML</span></div>
          <div class="chart-box short" id="chart-format-pie"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">阶段完备度 <span>有产出 = 100 分</span></div>
          <div class="chart-box short" id="chart-completeness"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">生命周期漏斗 <span>文档数量递减趋势</span></div>
          <div class="chart-box short" id="chart-funnel"></div>
        </div>
        <div class="chart-card full">
          <div class="chart-title">Gate 评审状态 <span>3 道门禁覆盖情况</span></div>
          <div class="chart-box short" id="chart-gate"></div>
        </div>
      </div>
    </div>


    <div class="view-panel" id="workflow-panel" data-hash="ai-workflow"></div>

    <div id="panels"></div>

    <div class="footer">Powered by <a href="https://echarts.apache.org/zh/index.html" style="color:var(--primary-active);font-weight:700;text-decoration:none">Apache ECharts</a> · 物理目录未变动</div>
  </main>
</div>

<script src="assets/workflow-panel.js"></script>
<script src="assets/stages-data.js"></script>
<script src="assets/doc-portal.js"></script>
<script src="assets/md-viewer.js"></script>

</body>
</html>
