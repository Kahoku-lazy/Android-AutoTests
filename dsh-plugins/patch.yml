# DSH 插件聚合覆盖层：从工作区挂载全部本地插件（代码不进 $DSH_HOME）
#
# 用法（启动时附加一次即可）：
#   dsh web --patch dsh-plugins/patch.yml
#
# 新增插件：在 plugins 数组里加一条（id 唯一，name 指向插件目录 index.js）
# 单个插件独立验证：dsh --profile web --patch dsh-plugins/patch.yml --dump-config
- id: arch-gate
  name: ./arch-gate/dist/index.js
  config:
    enabled: true
    # workspaceRoot 相对进程 cwd 解析；DSH 从项目根启动时保持 "." 即可，
    # 否则写死绝对路径：D:/Github/Android-AutoTests
    workspaceRoot: .
    toolNames: [write, edit]
    pathGlobs:
      - apps/**/*.py
    command: python
    args: [tools/gen_arch_stats.py, --check-boundaries]
    timeoutMs: 30000
    throttleMs: 30000
    passMarker: 零违规
    mode: inject
