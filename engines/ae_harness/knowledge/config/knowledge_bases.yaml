# 知识库目录：库名即向量集合名；资料目录只读。
# defaults 描述检索与切块参数；下面每个顶层键是一个库。
defaults:
  # 引用 config/models.yaml 里的向量模型短名。
  embedding: dashscope_embedding_v4
  top_k: 4
  # 余弦相似度下限。实测 0.55 会漏掉「缺水提醒」这类合理短查询（最高 0.549），
  # 0.45 能召回合理查询，同时把「今天天气」这类无关问题挡在门外。
  score_threshold: 0.45
  chunk_size: 400
  chunk_overlap: 60

product_manuals:
  description: 产品按键、指示灯、固件与恢复出厂资料
  data_dir: 'D:\Govee\data\rag_data'
  enabled: true

log_keywords:
  description: 设备日志功能点与关键词。本期只占位，不参与检索。
  data_dir: 'D:\Govee\data\rag_data\log_keywords'
  enabled: false
