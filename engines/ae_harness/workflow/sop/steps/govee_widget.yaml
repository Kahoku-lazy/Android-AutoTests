# Govee Home 小组件页核对
# task        交给执行者的操作说明
# description 验收者对照的终点：页面标题 + 两个组件类型

name: govee-widget-check
description: 打开 Govee Home 的小组件页，核对标题与组件类型。

task: >-
  启动 com.govee.home APP，点击底部状态栏第五个图标「我的主页」，
  进入后上滑找到「小组件」，检查有几个小组件。

steps:
  - subject: 找到小组件页，点击[小组件]
    description: >-
      页面停在「小组件」页面
      1. 页面标题必须是「小组件」；
      2. 页面必须同时出现「温湿度计」与「快捷操作」两个小组件类型。
    max_attempts: 3

  - subject: 如果页面在小组件则返回上一层级页面，点击固件更新
    description: >-
      页面停在「固件更新」页面
      1. 页面标题必须是「固件更新」；
      2. 页面中间出现文本“暂无可升级设备”
    max_attempts: 3

  - subject: 如果页面在固件更新则返回上一层级页面，点击设备分享
    description: >-
      页面停在「设备分享」页面
      1. 页面顶部有两个TAB，分别是[已分享]，[已接受]；
      2. 页面出现文本“本页面展示您分享给其他用户的设备”
    max_attempts: 3

  - subject: 如果页面在设备分享则返回上一层级页面，点击我的信息
    description: >-
      页面停在「我的信息」页面
      1. 页面顶部有四个TAB，分别是[全部消息]，[互动消息]、[系统通知]、[活动消息]；
      2. 页面内容正常加载出来
    max_attempts: 3

  - subject: 如果页面在我的信息则返回上一层级页面，点击[WATCH]
    description: >-
      页面停在「WATCH」页面
      1. 页面顶部「自动同步到WATCH」文本， 文本旁边还有一个开关，状态是开启；
      2. 页面内容正常加载出来
    max_attempts: 3

  - subject: 如果页面在[WATCH]则返回上一层级页面，点击[三方服务指南]
    description: >-
      页面停在「Third-Party Guide」页面
      1.「Voice Control」标签下有 Alexa、与 Govee Assistant 两个卡片，内容加载正确；
      2.「Smart Home Ecosystems」标签下有 [Matter]、[HomeKit]、 [SmartThings]、 [Google Home]四个卡片，内容加载正确；
      3.「Gaming Lighting Effects」标签下有 [Razer Chroma]卡片，内容加载正确；
    max_attempts: 3

  - subject: 关闭 com.govee.home APP
    description: >-
      页面回到手机桌面
    max_attempts: 3

