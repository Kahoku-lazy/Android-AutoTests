# SOP 步骤定义：每步一个里程碑，先执行、后验收。
# subject       步骤名，出现在报告与事件里
# description   这一步必须达成的结果，只写终点不写路线
# max_attempts  被驳回几次后判失败，默认 3

name: ui-task
description: 按里程碑推进手机 UI 任务，每步由验收者核对。
task: 回到桌面，然后打开设置

steps:
  - subject: 回到桌面
    description: 设备停在桌面，能看见 dock 和桌面图标。
    max_attempts: 3

  - subject: 打开设置
    description: 设备停在系统设置首页，能看见「连接」「显示」等条目。
    max_attempts: 3
