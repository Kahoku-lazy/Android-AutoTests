# UI 控制执行角色（设备操作）
UI_EXECUTOR_ROLE_CONFIG:
  ModelConfig:
    api_key: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    provider: deepseek
    model_name: deepseek-flash
    vision: true
    stream: false

  RoleConfig:
    name: ui_executor_role
    system_prompt: UI_EXECUTOR_PROMPT

  ToolsConfig:

  ContextConfig:
    trigger_ratio: 0.7
    reserve_ratio: 0.2
    tool_result_limit: 400000
    max_image_num: 5

  ReActConfig:
    max_iters: 60
    structured_output_grace_iters: 5
    stop_on_reject: true


