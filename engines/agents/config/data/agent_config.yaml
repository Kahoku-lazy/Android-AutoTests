# UI 控制执行角色（设备操作）
UI_EXECUTOR_ROLE_CONFIG:
  ModelConfig:
    model: deepseek_flash
    stream: false

  RoleConfig:
    name: ui_executor_role
    system_prompt: UI_EXECUTOR_PROMPT

  ToolsConfig:
    modules: [device, observe]

  ContextConfig:
    trigger_ratio: 0.7
    reserve_ratio: 0.2
    tool_result_limit: 400000
    max_image_num: 5

  ReActConfig:
    max_iters: 60
    structured_output_grace_iters: 5
    stop_on_reject: true


# UI 控制验收角色
UI_VERIFIER_ROLE_CONFIG:
  ModelConfig:
    model: deepseek_flash
    stream: false

  RoleConfig:
    name: ui_verifier_role
    system_prompt: UI_VERIFIER_PROMPT

  ToolsConfig:
    modules: [observe]

  ContextConfig:

  ReActConfig:
    max_iters: 30
    structured_output_grace_iters: 5
    stop_on_reject: true


# 用例编写执行角色
CASE_WRITER_ROLE_CONFIG:
