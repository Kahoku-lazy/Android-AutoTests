    model: deepseek_flash
    stream: true

  RoleConfig:
    name: case_writer_role
    system_prompt: CASE_WRITER_PROMPT

  ToolsConfig:

  ContextConfig:

  ReActConfig:
    # 增量交付：保存状态机 + 逐批追加场景/用例 + 读回产物，轮次比「一次写整篇」多
    max_iters: 60
    structured_output_grace_iters: 5
    stop_on_reject: true


