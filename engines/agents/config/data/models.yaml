# 模型资产表：唯一模型数据源（角色只写 model: <短名> 引用）
# 每条用 family 标记类别：chat / realtime / embedding / tts
# 字段说明见 engines/agents/models/AGENTS.md；改这里不需要改代码。
deepseek_flash:
  family: chat
  provider: deepseek
  model_name: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  input_types: [text/plain, image/png, image/jpeg, image/webp]
  output_types: [text/plain, application/x-thinking]
  context_size: 128000
  output_size: 8192
  max_retries: 1
  formatter: chat
  parameters:
    thinking_enable: true

deepseek_pro:
  family: chat
  provider: deepseek
  model_name: deepseek-v4-pro
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com/v1
  input_types: [text/plain]
  output_types: [text/plain, application/x-thinking]
  context_size: 128000
  output_size: 8192
  max_retries: 1
  formatter: chat
  parameters:
    thinking_enable: true

qwen_plus:
  family: chat
  provider: dashscope
  model_name: qwen-plus
  api_key_env: DASHSCOPE_API_KEY
  input_types: [text/plain, image/png, image/jpeg]
  output_types: [text/plain]
  context_size: 131072
  output_size: 8192
  max_retries: 1
  formatter: chat

omni:
  family: realtime
  provider: dashscope
  model_name: qwen3.5-omni-plus-realtime
  api_key_env: DASHSCOPE_API_KEY
  voice: Tina
  # voices: [Tina, Cherry, Serena, Ethan, Chelsie]

text_embedding_v4:
  family: embedding
  provider: dashscope
  model_name: text-embedding-v4
  api_key_env: DASHSCOPE_API_KEY
  dimensions: 1024

qwen3_tts:
  family: tts
  provider: dashscope
  model_name: qwen3-tts-flash
  api_key_env: DASHSCOPE_API_KEY
  voice: Cherry
