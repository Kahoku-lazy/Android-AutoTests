<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Spectrum 侧边栏 — 原型</title>
<style>
/* ═══════════════════════════════════════════
   Aurora Spectrum Sidebar — 设计原型
   默认态：单一主题色（Soft Glass 蓝绿）
   选中后：8 色光谱绽放 + Anime.js 极光向页面扩散
   ═══════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap');

:root {
  /* ── 8 色光谱（surface / deep / glow）── */
  --s-yellow:    #fff3c4;  --s-yellow-deep:  #b8961e;  --s-yellow-glow:  rgba(255,220,140,0.55);
  --s-green:     #c6f0d4;  --s-green-deep:   #5a9e48;  --s-green-glow:   rgba(170,224,160,0.55);
  --s-teal:      #b8ece4;  --s-teal-deep:    #1a8a7d;  --s-teal-glow:    rgba(130,220,200,0.55);
  --s-blue:      #cee4ff;  --s-blue-deep:    #4a7fbd;  --s-blue-glow:    rgba(150,200,255,0.55);
  --s-purple:    #ddd8f5;  --s-purple-deep:  #6e5db5;  --s-purple-glow:  rgba(180,160,235,0.55);
  --s-pink:      #fddce4;  --s-pink-deep:    #d4607a;  --s-pink-glow:    rgba(245,180,195,0.55);
  --s-amber:     #f0e4cc;  --s-amber-deep:   #8b6914;  --s-amber-glow:   rgba(220,180,120,0.50);
  --s-orange:    #ffe4cc;  --s-orange-deep:  #d4782e;  --s-orange-glow:  rgba(250,190,130,0.55);

  /* ── 默认主题色（Soft Glass 蓝绿）── */
  --theme-surface:  #d4eaff;
  --theme-deep:     #6f9fd8;
  --theme-glow:     rgba(162,210,255,0.45);
  --theme-icon-bg:  linear-gradient(145deg, rgba(255,255,255,0.74), rgba(212,234,255,0.68));

  /* 玻璃基底 */
  --side-bg: rgba(255,255,255,0.52);
  --side-border: rgba(255,255,255,0.68);
  --side-text: #4a4e69;
  --side-text-secondary: #9a8c98;
  --side-blur: 22px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  background:
    radial-gradient(circle at 14% 12%, rgba(255,255,255,0.82), transparent 28%),
    radial-gradient(circle at 82% 18%, rgba(162,210,255,0.52), transparent 32%),
    radial-gradient(circle at 78% 92%, rgba(63,158,216,0.42), transparent 36%),
    radial-gradient(circle at 12% 88%, rgba(111,185,141,0.42), transparent 34%),
    linear-gradient(135deg, #dff5ff 0%, #d4eaff 38%, #a7d8ee 68%, #d6f2da 100%);
  background-size: 180% 180%;
  animation: bodyGradient 15s ease infinite;
  height: 100vh;
  display: flex;
  align-items: stretch;
  overflow: hidden;
  position: relative;
}

@keyframes bodyGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── 极光画布（仅选中模块后显示）── */
#aurora-canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  opacity: 0;
  transition: opacity 0.7s ease;
}
body.has-active #aurora-canvas { opacity: 1; }

.preview-area { position: relative; z-index: 1; }

/* ═══════════════════════════════════════════
   Sidebar Shell
   ═══════════════════════════════════════════ */
.sidebar {
  width: 236px; min-width: 236px; height: 100%;
  background: var(--side-bg);
  backdrop-filter: blur(var(--side-blur));
  -webkit-backdrop-filter: blur(var(--side-blur));
  border-right: 1px solid var(--side-border);
  box-shadow: 8px 0 32px rgba(31, 38, 135, 0.06);
  display: flex; flex-direction: column;
  overflow: hidden; position: relative; z-index: 2;
}

/* ── 默认态：单一主题色柔光 ── */
.sidebar::before {
  content: ''; position: absolute; inset: 0; z-index: 0;
  pointer-events: none; opacity: 0.5;
  background:
    radial-gradient(ellipse 70% 60% at 50% 30%, rgba(162,210,255,0.18), transparent),
    radial-gradient(ellipse 60% 50% at 50% 80%, rgba(111,185,141,0.12), transparent);
  transition: opacity 0.7s ease;
}

/* ── 选中模块后：只用该模块色做侧边栏柔光 ── */
body.has-active .sidebar::before {
  opacity: 0.55;
  background:
    radial-gradient(ellipse 70% 50% at 50% 40%, var(--active-glow, rgba(162,210,255,0.3)), transparent 65%),
    radial-gradient(ellipse 50% 40% at 50% 75%, var(--active-glow-soft, rgba(162,210,255,0.15)), transparent 60%);
  animation: activeGlowPulse 4s ease-in-out infinite;
}

@keyframes activeGlowPulse {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 0.65; }
}

.sidebar__inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; height: 100%;
}

/* ═══════════════════════════════════════════
   Header
   ═══════════════════════════════════════════ */
.sidebar__header {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.55);
  cursor: pointer; flex-shrink: 0;
}

/* ── Logo：默认静态蓝绿 ── */
.sidebar__logo {
  width: 34px; height: 34px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(162,210,255,0.5));
  display: grid; place-items: center; font-size: 16px;
  box-shadow: 0 8px 20px rgba(74,78,105,0.08);
  transition: background 0.7s ease;
}

/* ── Logo：选中后光谱流动 ── */
body.has-active .sidebar__logo {
  background: linear-gradient(135deg,
    #fff3c4, #c6f0d4, #b8ece4, #cee4ff, #ddd8f5, #fddce4, #ffe4cc);
  background-size: 400% 400%;
  animation: logoAurora 6s ease-in-out infinite;
}

@keyframes logoAurora {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.sidebar__brand {
  font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
}

/* ── 品牌文字：默认静态蓝绿 ── */
.brand-ai, .brand-name {
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: all 0.7s ease;
}

.brand-ai {
  background-image: linear-gradient(90deg, #6f9fd8, #a2d2ff);
}

.brand-name {
  background-image: linear-gradient(90deg, #5e8fca, #6f9fd8);
  margin-left: 2px;
}

/* ── 品牌文字：选中后 8 色光谱流动 ── */
body.has-active .brand-ai,
body.has-active .brand-name {
  background-size: 300% 100%;
  animation: brandAurora 4s ease-in-out infinite;
}

body.has-active .brand-ai {
  background-image: linear-gradient(90deg,
    #b8961e, #5a9e48, #1a8a7d, #6e5db5, #d4607a, #d4782e, #6e5db5, #b8961e);
}

body.has-active .brand-name {
  background-image: linear-gradient(90deg,
    #6e5db5, #d4607a, #d4782e, #b8961e, #5a9e48, #1a8a7d, #4a7fbd, #6e5db5);
  animation-delay: -0.6s;
}

.sidebar__header:hover .brand-ai,
.sidebar__header:hover .brand-name {
  animation-duration: 1.8s !important;
}

@keyframes brandAurora {
  0%   { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

/* ═══════════════════════════════════════════
   Navigation Items
   ═══════════════════════════════════════════ */
.sidebar__nav {
  flex: 1; overflow-y: auto;
  padding: 14px 12px;
  display: flex; flex-direction: column; gap: 10px;
}

/* ── 默认态：所有菜单项统一主题色 ── */
.nav-item {
  --item-surface: var(--theme-surface);
  --item-deep: var(--theme-deep);
  --item-glow: var(--theme-glow);

  display: flex; align-items: center; gap: 12px;
  height: 50px; padding: 0 18px;
  font-size: 15px; font-weight: 700;
  color: var(--side-text-secondary);
  border-radius: 16px; cursor: pointer;
  position: relative;
  transition: color 0.2s ease, background 0.25s ease, box-shadow 0.25s ease,
              --item-surface 0.7s ease, --item-deep 0.7s ease, --item-glow 0.7s ease;
}

/* Left accent bar */
.nav-item::before {
  content: ''; position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  width: 4px; height: 0;
  border-radius: 0 4px 4px 0;
  background: linear-gradient(180deg, var(--item-surface), var(--item-deep));
  transition: height 0.28s cubic-bezier(0.34,1.56,0.64,1);
}

.nav-item:hover::before { height: 24px; }
.nav-item.active::before { height: 34px; }

/* Hover */
.nav-item:hover { background: rgba(255,255,255,0.40); color: var(--side-text); }

/* Active */
.nav-item.active {
  color: var(--item-deep); font-weight: 800;
  background: color-mix(in srgb, var(--item-surface) 35%, rgba(255,255,255,0.35));
  box-shadow: 0 4px 18px var(--item-glow), inset 0 1px 0 rgba(255,255,255,0.6);
}

.nav-item.active::after {
  content: ''; position: absolute; left: 8px; right: 8px; height: 100%;
  border-radius: 16px; background: var(--item-glow);
  filter: blur(18px); opacity: 0.25;
  z-index: -1; pointer-events: none;
}

/* Icon */
.nav-item__icon {
  width: 34px; height: 34px; border-radius: 12px;
  display: grid; place-items: center; flex-shrink: 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.74), var(--item-surface));
  border: 1px solid rgba(255,255,255,0.82);
  box-shadow: 0 10px 24px rgba(74,78,105,0.10), inset 0 1px 0 rgba(255,255,255,0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--item-deep);
  transition: all 0.25s ease;
  font-size: 16px;
}

.nav-item.active .nav-item__icon {
  box-shadow: 0 6px 18px var(--item-glow), inset 0 1px 0 rgba(255,255,255,0.75);
  transform: scale(1.06);
}
.nav-item:hover .nav-item__icon { transform: scale(1.04); }

.nav-item__label {
  flex: 1; min-width: 0; line-height: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.nav-item__badge {
  font-size: 10px; font-weight: 800;
  padding: 2px 8px; border-radius: 10px;
  letter-spacing: 0.4px; color: #fff;
  background: linear-gradient(135deg, #b39ef3, #889df0);
  box-shadow: 0 1px 0 rgba(0,0,0,0.12);
}
.nav-item.active .nav-item__badge {
  color: var(--item-deep); background: rgba(255,255,255,0.7);
}

/* ═══════════════════════════════════════════
   只有被选中的模块才显示自己的颜色
   ═══════════════════════════════════════════ */
.nav-item--dashboard.active  { --item-surface: var(--s-yellow); --item-deep: var(--s-yellow-deep); --item-glow: var(--s-yellow-glow); }
.nav-item--devices.active    { --item-surface: var(--s-green);  --item-deep: var(--s-green-deep);  --item-glow: var(--s-green-glow);  }
.nav-item--elements.active   { --item-surface: var(--s-purple); --item-deep: var(--s-purple-deep); --item-glow: var(--s-purple-glow); }
.nav-item--cases.active      { --item-surface: var(--s-teal);   --item-deep: var(--s-teal-deep);   --item-glow: var(--s-teal-glow);   }
.nav-item--workflow.active   { --item-surface: var(--s-blue);   --item-deep: var(--s-blue-deep);   --item-glow: var(--s-blue-glow);   }
.nav-item--runner.active     { --item-surface: var(--s-pink);   --item-deep: var(--s-pink-deep);   --item-glow: var(--s-pink-glow);   }
.nav-item--reports.active    { --item-surface: var(--s-amber);  --item-deep: var(--s-amber-deep);  --item-glow: var(--s-amber-glow);  }
.nav-item--ai.active         { --item-surface: var(--s-orange); --item-deep: var(--s-orange-deep); --item-glow: var(--s-orange-glow); }

/* ═══════════════════════════════════════════
   Footer
   ═══════════════════════════════════════════ */
.sidebar__footer {
  position: relative; z-index: 1;
  padding: 12px 16px;
  border-top: 1px solid var(--side-border);
  /* 默认：主题蓝绿 */
  background: linear-gradient(135deg, rgba(189,224,254,0.78), rgba(162,210,255,0.82));
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
  transition: background 0.7s ease;
}

/* 选中后：光谱渐变 */
body.has-active .sidebar__footer {
  background: linear-gradient(135deg,
    rgba(255,243,196,0.45), rgba(198,240,212,0.45),
    rgba(184,236,228,0.50), rgba(206,228,255,0.50),
    rgba(221,216,245,0.45));
}

.sidebar__user {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700;
  color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.10);
}

/* 用户名：默认白色 → 选中后金橙色 */
.sidebar__user-name {
  transition: color 0.7s ease;
}
body.has-active .sidebar__user-name {
  color: #b8961e;
  text-shadow: 0 1px 0 rgba(255,255,255,0.6);
}

.sidebar__user-avatar {
  width: 24px; height: 24px; border-radius: 8px;
  background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(162,210,255,0.5));
  display: grid; place-items: center; font-size: 12px;
}

.logout-btn {
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: 20px;
  background: rgba(255,255,255,0.25);
  color: #fff; font-weight: 700;
  font-size: 12px; padding: 5px 14px;
  cursor: pointer; font-family: inherit;
  transition: all 0.2s ease;
}
.logout-btn:hover {
  background: rgba(255,255,255,0.4);
  transform: translateY(-1px);
}

/* ═══════════════════════════════════════════
   Right side preview area
   ═══════════════════════════════════════════ */
.preview-area {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 48px;
}

.preview-card {
  background: rgba(255,255,255,0.50);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.68);
  border-radius: 24px;
  padding: 36px 48px;
  box-shadow: 0 8px 32px rgba(31,38,135,0.07);
  text-align: center; max-width: 480px;
  transition: box-shadow 0.7s ease, border-color 0.7s ease;
}

.preview-card h1 {
  font-size: 22px; font-weight: 800;
  color: #4a4e69; margin-bottom: 8px;
}

.preview-card p {
  color: #9a8c98;
  font-size: 14px; line-height: 1.7; margin-bottom: 16px;
}

.preview-card .hint {
  font-size: 12px; color: #a8b5c4;
}

.color-legend {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 12px;
}
.color-dot {
  width: 12px; height: 12px; border-radius: 50%;
  display: inline-block;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  /* 默认灰色 → 选中后显色 */
  filter: grayscale(1);
  transition: filter 0.7s ease;
}
body.has-active .color-dot { filter: grayscale(0); }

/* Resizer */
.sidebar__resizer {
  position: absolute; top: 0; right: 0;
  width: 6px; height: 100%;
  cursor: col-resize; z-index: 5;
  transform: translateX(50%);
}
.sidebar__resizer::before {
  content: ''; position: absolute;
  top: 12px; bottom: 12px; left: 50%;
  width: 2px; transform: translateX(-50%);
  border-radius: 2px;
  background: rgba(255,255,255,0.62);
  transition: background 0.15s, width 0.15s;
}
.sidebar__resizer:hover::before {
  width: 3px; background: #a2d2ff;
}

/* Scrollbar */
.sidebar__nav::-webkit-scrollbar { width: 3px; }
.sidebar__nav::-webkit-scrollbar-thumb {
  background: rgba(162,210,255,0.3); border-radius: 10px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.2.2/lib/anime.min.js"></script>
</head>
<body class="has-active">

<canvas id="aurora-canvas"></canvas>

<!-- ═══════════════════════════════════════════
     Aurora Spectrum Sidebar
     ═══════════════════════════════════════════ -->
<aside class="sidebar">
  <div class="sidebar__inner">

    <div class="sidebar__header" onclick="deselectAll()">
      <div class="sidebar__logo"></div>
      <div class="sidebar__brand">
        <span class="brand-ai">AI</span><span class="brand-name">测试平台</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      <div class="nav-item nav-item--dashboard active"
           onclick="setActive(this)" data-module="仪表盘" data-color-key="dashboard">
        <span class="nav-item__icon"></span>
        <span class="nav-item__label">仪表盘</span>
      </div>
      <div class="nav-item nav-item--devices"
           onclick="setActive(this)" data-module="设备管理" data-color-key="devices">
        <span class="nav-item__icon"></span>
        <span class="nav-item__label">设备管理</span>
      </div>
      <div class="nav-item nav-item--elements"
           onclick="setActive(this)" data-module="元素定位" data-color-key="elements">
        <span class="nav-item__icon"></span>
        <span class="nav-item__label">元素定位</span>
      </div>
      <div class="nav-item nav-item--cases"
           onclick="setActive(this)" data-module="测试用例" data-color-key="cases">
        <span class="nav-item__icon"></span>
        <span class="nav-item__label">测试用例</span>
      </div>
      <div class="nav-item nav-item--workflow"
           onclick="setActive(this)" data-module="工作流" data-color-key="workflow">
        <span class="nav-item__icon"></span>
        <span class="nav-item__label">工作流</span>
        <span class="nav-item__badge">开发中</span>
      </div>
      <div class="nav-item nav-item--runner"
           onclick="setActive(this)" data-module="执行引擎" data-color-key="runner">

        <span class="nav-item__label">测试报告</span>
      </div>
      <div class="nav-item nav-item--ai"
           onclick="setActive(this)" data-module="AI 助手" data-color-key="ai">
        <span class="nav-item__icon"></span>
        <span class="nav-item__label">AI 助手</span>
        <span class="nav-item__badge">开发中</span>
      </div>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__user-avatar"></div>
        <span class="sidebar__user-name">admin</span>
      </div>
      <button class="logout-btn" onclick="alert('退出')">退出</button>
    </div>

    <div class="sidebar__resizer"></div>
  </div>
</aside>

<!-- ═══════════════════════════════════════════
     Right Preview Area
     ═══════════════════════════════════════════ -->
<div class="preview-area">
  <div class="preview-card">
    <h1 id="previewTitle">仪表盘</h1>
    <p id="previewDesc">
      已选中 <b>仪表盘</b> — 暖金色从侧边栏向页面流动。<br>
      再次点击可取消选中，所有颜色回归主题蓝绿。
    </p>
    <div class="color-legend">
      <span class="color-dot" style="background:#fff3c4" title="仪表盘·暖金"></span>
      <span class="color-dot" style="background:#c6f0d4" title="设备管理·翠绿"></span>
      <span class="color-dot" style="background:#ddd8f5" title="元素定位·紫罗兰"></span>
      <span class="color-dot" style="background:#b8ece4" title="测试用例·湖蓝"></span>
      <span class="color-dot" style="background:#cee4ff" title="工作流·天蓝"></span>
      <span class="color-dot" style="background:#fddce4" title="执行引擎·玫瑰"></span>
      <span class="color-dot" style="background:#f0e4cc" title="测试报告·琥珀"></span>
      <span class="color-dot" style="background:#ffe4cc" title="AI助手·蜜橙"></span>
    </div>
    <p class="hint" style="margin-top:12px">点击色点对应菜单项，观察全页颜色绽放效果</p>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   Anime.js Canvas Aurora — 极光流动引擎
   ═══════════════════════════════════════════════ */

const canvas = document.getElementById('aurora-canvas')
const ctx = canvas.getContext('2d')

const MODULE_COLORS = {
  dashboard: { r: 255, g: 220, b: 140, glow: 'rgba(255,220,140,0.45)', glowSoft: 'rgba(255,240,180,0.28)' },
  devices:   { r: 170, g: 224, b: 160, glow: 'rgba(170,224,160,0.45)', glowSoft: 'rgba(210,240,200,0.28)' },
  elements:  { r: 180, g: 160, b: 235, glow: 'rgba(180,160,235,0.45)', glowSoft: 'rgba(215,200,245,0.28)' },
  cases:     { r: 130, g: 220, b: 200, glow: 'rgba(130,220,200,0.45)', glowSoft: 'rgba(180,235,225,0.28)' },
  workflow:  { r: 150, g: 200, b: 255, glow: 'rgba(150,200,255,0.45)', glowSoft: 'rgba(200,225,255,0.28)' },
  runner:    { r: 245, g: 180, b: 195, glow: 'rgba(245,180,195,0.45)', glowSoft: 'rgba(250,210,220,0.28)' },
  reports:   { r: 220, g: 180, b: 120, glow: 'rgba(220,180,120,0.45)', glowSoft: 'rgba(235,205,155,0.26)' },
  ai:        { r: 250, g: 190, b: 130, glow: 'rgba(250,190,130,0.45)', glowSoft: 'rgba(255,215,170,0.28)' },
}

let auroraAnim = null
let colorTransition = null
let currentRGB = { r: 255, g: 220, b: 140 }
let activeKey = 'dashboard'

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1
  canvas.width = window.innerWidth * dpr
  canvas.height = window.innerHeight * dpr
  canvas.style.width = window.innerWidth + 'px'
  canvas.style.height = window.innerHeight + 'px'
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.scale(dpr, dpr)
}
window.addEventListener('resize', resizeCanvas)
resizeCanvas()

/* ── 绘制 5 层极光光带 ── */
function drawAurora(t) {
  const w = window.innerWidth, h = window.innerHeight
  const { r, g, b } = currentRGB
  ctx.clearRect(0, 0, w, h)

  const ribbons = [
    { baseY: h * 0.08, amp: 55, thick: 140, speed: 1.0,  alpha: 0.07,  freq: 0.0018 },
    { baseY: h * 0.28, amp: 70, thick: 170, speed: 0.7,  alpha: 0.09,  freq: 0.0022 },
    { baseY: h * 0.50, amp: 80, thick: 200, speed: 0.85, alpha: 0.10,  freq: 0.0015 },
    { baseY: h * 0.70, amp: 65, thick: 160, speed: 0.6,  alpha: 0.08,  freq: 0.0020 },
    { baseY: h * 0.90, amp: 50, thick: 130, speed: 0.75, alpha: 0.06,  freq: 0.0017 },
  ]

  ribbons.forEach((rib, i) => {
    const phase = t * rib.speed * Math.PI * 2 + i * 1.8
    ctx.beginPath()
    ctx.moveTo(-50, rib.baseY + Math.sin(phase) * rib.amp)
    for (let x = -50; x <= w + 50; x += 8) {
      ctx.lineTo(x, rib.baseY + Math.sin(x * rib.freq + phase) * rib.amp)
    }
    const bp = phase + 0.6
    for (let x = w + 50; x >= -50; x -= 8) {
      ctx.lineTo(x, rib.baseY + rib.thick + Math.sin(x * rib.freq + bp) * rib.amp * 0.7)
    }
    ctx.closePath()

    const grad = ctx.createLinearGradient(w * 0.08, 0, w, 0)
    grad.addColorStop(0,   `rgba(${r},${g},${b},${rib.alpha * 1.4})`)
    grad.addColorStop(0.3, `rgba(${r},${g},${b},${rib.alpha})`)
    grad.addColorStop(0.6, `rgba(${r},${g},${b},${rib.alpha * 0.4})`)
    grad.addColorStop(1,   `rgba(${r},${g},${b},0)`)
    ctx.fillStyle = grad
    ctx.fill()
  })

  // 柔光斑点
  for (let i = 0; i < 3; i++) {
    const cy = h * (0.15 + i * 0.35)
    const cx = w * 0.06 + Math.sin(t * 1.3 + i * 2) * 40
    const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.4)
    g2.addColorStop(0, `rgba(${r},${g},${b},0.12)`)
    g2.addColorStop(1, `rgba(${r},${g},${b},0)`)
    ctx.fillStyle = g2
    ctx.fillRect(0, 0, w, h)
  }
}

/* ── 启动极光 ── */
function startAurora(key) {
  const target = MODULE_COLORS[key]
  if (colorTransition) colorTransition.pause()
  colorTransition = anime({
    targets: currentRGB,
    r: target.r, g: target.g, b: target.b,
    duration: 800, easing: 'easeInOutCubic',
  })

  if (auroraAnim && !auroraAnim.paused) return
  const phase = { t: 0 }
  auroraAnim = anime({
    targets: phase, t: [0, 1],
    duration: 5000, loop: true, easing: 'linear',
    update: () => drawAurora(phase.t),
  })
}

/* ── 停止极光 ── */
function stopAurora() {
  if (auroraAnim) { auroraAnim.pause(); auroraAnim = null }
  if (colorTransition) { colorTransition.pause(); colorTransition = null }
  setTimeout(() => { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight) }, 700)
}

/* ── 预览卡片更新 ── */
function updateCard(key, active) {
  const card = document.querySelector('.preview-card')
  if (active && key) {
    const c = MODULE_COLORS[key]
    card.style.boxShadow = `0 0 80px rgba(${c.r},${c.g},${c.b},0.30), 0 8px 32px rgba(31,38,135,0.07)`
    card.style.borderColor = `rgba(${c.r},${c.g},${c.b},0.25)`
  } else {
    card.style.boxShadow = ''
    card.style.borderColor = ''
  }
}

/* ── 菜单点击 ── */
function setActive(el) {
  const wasActive = el.classList.contains('active')
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'))

  if (wasActive) {
    deselectAll()
    return
  }

  el.classList.add('active')
  const key = el.dataset.colorKey
  activeKey = key

  // 页面 + 侧边栏进入彩色模式
  document.body.classList.add('has-active')
  // 设置侧边栏柔光色
  document.body.style.setProperty('--active-glow', MODULE_COLORS[key].glow)
  document.body.style.setProperty('--active-glow-soft', MODULE_COLORS[key].glowSoft)
  startAurora(key)
  updateCard(key, true)

  document.getElementById('previewTitle').textContent = el.dataset.module
  document.getElementById('previewDesc').innerHTML =
    '<b>' + el.dataset.module + '</b> 模块色从侧边栏向整页扩散流动。<br>再次点击可取消选中，颜色回归主题蓝绿。'
}

/* ── 取消所有选中（点击标题）── */
function deselectAll() {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'))
  document.body.classList.remove('has-active')
  document.body.style.removeProperty('--active-glow')
  document.body.style.removeProperty('--active-glow-soft')
  stopAurora()
  updateCard(null, false)
  activeKey = null
  document.getElementById('previewTitle').textContent = 'Aurora Spectrum 侧边栏'
  document.getElementById('previewDesc').innerHTML =
    '未选中任何模块 — 页面与侧边栏回归单一主题色。<br>点击菜单项，颜色绽放。'
}

// 初始化：仪表盘默认选中
document.addEventListener('DOMContentLoaded', () => {
  resizeCanvas()
  document.body.style.setProperty('--active-glow', MODULE_COLORS.dashboard.glow)
  document.body.style.setProperty('--active-glow-soft', MODULE_COLORS.dashboard.glowSoft)
  startAurora('dashboard')
  updateCard('dashboard', true)
})
</script>
