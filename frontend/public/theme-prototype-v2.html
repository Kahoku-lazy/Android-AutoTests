<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浅海工作台 · 测试平台主题原型 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   设计令牌 · 浅海工作台
   ═══════════════════════════════════════════ */
:root {
  /* ── 色板 ── */
  --sea-current:    #1A6B80;
  --sea-reef:       #3C99B0;
  --sea-spray:      #D8F0F5;
  --sea-seafoam:    #D5EDE2;
  --sea-kelp:       #5DAA86;
  --sea-coral:      #E5876F;
  --sea-deep:       #0F4050;
  --sea-white:      #F5FAFB;

  /* ── 毛玻璃 ── */
  --glass-bg:       rgba(255,255,255,0.42);
  --glass-bg-heavy: rgba(255,255,255,0.62);
  --glass-border:   rgba(26,107,128,0.10);
  --glass-blur:     18px;

  /* ── 圆角 ── */
  --r-xs:  8px;
  --r-sm:  12px;
  --r-md:  18px;
  --r-lg:  24px;
  --r-xl:  32px;
  --r-full: 999px;

  /* ── 阴影 ── */
  --shadow-card:    0 2px 12px rgba(15,64,80,0.06);
  --shadow-card-h:  0 6px 24px rgba(15,64,80,0.10);
  --shadow-glow:    0 0 0 3px rgba(26,107,128,0.12);
  --shadow-sidebar: 2px 0 20px rgba(15,64,80,0.05);

  /* ── 间距 ── */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px;  --space-5: 20px;  --space-6: 24px;
  --space-8: 32px;  --space-10: 40px;

  /* ── 字体 ── */
  --font-display: 'Lexend', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body:    'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;

  /* ── 字号层级 ── */
  --text-xs:   11px;   --text-sm:  12.5px;  --text-base: 14px;
  --text-md:   16px;   --text-lg:  20px;    --text-xl:  26px;
  --text-2xl:  34px;

  /* ── 动效 ── */
  --ease-out:   cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --dur-fast:   150ms;
  --dur-normal: 280ms;
  --dur-slow:   450ms;

  /* ── 侧边栏 ── */
  --sidebar-w: 236px;
  --sidebar-collapsed: 64px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%; overflow: hidden;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--sea-deep);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════
   背景 — 浅海流动渐变
   ═══════════════════════════════════════ */
body {
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, #E0F3F7 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 80% 70%, #DFF0E8 0%, transparent 55%),
    radial-gradient(ellipse 50% 50% at 50% 50%, #D8F0F5 0%, #DCEBE6 100%);
  background-size: 100% 100%;
  animation: seaShift 18s ease-in-out infinite;
}

@keyframes seaShift {
  0%,100% { background-position: 0% 0%, 100% 100%, 50% 50%; }
  33%    { background-position: -5% 3%, 102% 96%, 48% 52%; }
  66%    { background-position: 3% -2%, 97% 103%, 52% 48%; }
}

/* 水下光纹 — 微弱的焦散效果 */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle 200px at 25% 30%, rgba(255,255,255,0.35) 0%, transparent 70%),
    radial-gradient(circle 180px at 70% 60%, rgba(255,255,255,0.25) 0%, transparent 70%),
    radial-gradient(circle 160px at 45% 80%, rgba(255,255,255,0.20) 0%, transparent 70%);
  animation: caustics 14s ease-in-out infinite;
}
@keyframes caustics {
  0%,100% { opacity: 0.6; }
  50%     { opacity: 1; }
}

/* ═══════════════════════════════════════
   应用壳层
   ═══════════════════════════════════════ */
.app-shell {
  display: flex; height: 100vh; position: relative; z-index: 1;
}

/* ═══════════════════════════════════════
   侧边栏 — 玻璃 + 深度标尺
   ═══════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  height: 100%;
  background: var(--glass-bg-heavy);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-right: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sidebar);
  display: flex; flex-direction: column;
  position: relative; z-index: 10;
  transition: width var(--dur-normal) var(--ease-out),
              min-width var(--dur-normal) var(--ease-out);
}
.sidebar.collapsed {
  width: var(--sidebar-collapsed); min-width: var(--sidebar-collapsed);
}

/* 品牌区 */
.sidebar-brand {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-5) var(--space-5);
  border-bottom: 1px solid var(--glass-border);
  cursor: pointer;
}
.sidebar.collapsed .sidebar-brand { justify-content: center; padding: var(--space-5) var(--space-2); }

.brand-mark {
  width: 38px; height: 38px; border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--sea-current), var(--sea-reef));
  display: grid; place-items: center; flex-shrink: 0;
  font-size: 18px; color: #fff;
  box-shadow: 0 4px 12px rgba(26,107,128,0.24);
}

.brand-text { overflow: hidden; white-space: nowrap; }
.brand-name {
  font-family: var(--font-display); font-size: 16px; font-weight: 700;
  background: linear-gradient(135deg, var(--sea-current), var(--sea-reef));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-sub {
  font-size: var(--text-xs); color: #7A9FAA; font-weight: 500;
}

/* 折叠按钮 */
.toggle-btn {
  position: absolute; top: 22px; right: -15px;
  width: 30px; height: 30px; border-radius: 50%;
  border: 1.5px solid var(--glass-border);
  background: #fff; color: var(--sea-current); cursor: pointer;
  font-size: 13px; font-weight: 700; display: grid; place-items: center;
  z-index: 20; box-shadow: var(--shadow-card);
  transition: all var(--dur-fast) var(--ease-out);
}
.toggle-btn:hover { background: var(--sea-current); color: #fff; border-color: var(--sea-current); }
.sidebar.collapsed .toggle-btn { right: -15px; }

/* 导航列表 */
.sidebar-nav {
  flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-2);
  display: flex; flex-direction: column; gap: 2px;
}

.nav-item {
  display: flex; align-items: center; gap: var(--space-3);
  height: 44px; padding: 0 var(--space-4); border-radius: var(--r-md);
  font-size: var(--text-base); font-weight: 600; color: #4B7888;
  cursor: pointer; position: relative; text-decoration: none;
  transition: all var(--dur-normal) var(--ease-out);
  overflow: visible;
}
.sidebar.collapsed .nav-item { justify-content: center; padding: 0; }

/* 深度标尺 — 标志性元素 */
.nav-item::before {
  content: '';
  position: absolute; left: 2px; top: 8px; bottom: 8px;
  width: 3px; border-radius: 3px;
  background: transparent;
  transition: all var(--dur-normal) var(--ease-out);
}
.nav-item:hover::before {
  background: rgba(26,107,128,0.18);
}
.nav-item.active::before {
  background: linear-gradient(180deg, var(--sea-current), var(--sea-reef), var(--sea-kelp));
  box-shadow: 0 0 8px rgba(26,107,128,0.25);
}

/* 选中态 */
.nav-item.active {
  background: linear-gradient(135deg, rgba(26,107,128,0.10), rgba(93,170,134,0.06));
  color: var(--sea-current);
}

.nav-icon {
  width: 20px; height: 20px; display: grid; place-items: center; flex-shrink: 0;
  transition: transform var(--dur-normal) var(--ease-spring);
}
.nav-item:hover .nav-icon  { transform: scale(1.12); }
.nav-item.active .nav-icon { color: var(--sea-current); }
.nav-icon svg { width: 20px; height: 20px; }
.nav-label {
  flex: 1; font-size: 13.5px; white-space: nowrap;
  transition: opacity var(--dur-fast) var(--ease-out);
}
.sidebar.collapsed .nav-label { opacity: 0; }

/* 底部 */
.sidebar-footer {
  padding: var(--space-4); border-top: 1px solid var(--glass-border);
  display: flex; align-items: center; gap: var(--space-3);
}
.sidebar.collapsed .sidebar-footer { justify-content: center; padding: var(--space-4) var(--space-2); }

.user-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sea-reef), var(--sea-kelp));
  display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700;
  flex-shrink: 0;
}
.user-name { font-weight: 700; font-size: var(--text-sm); }
.user-role { font-size: var(--text-xs); color: #7A9FAA; }

/* ═══════════════════════════════════════
   主内容区
   ═══════════════════════════════════════ */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* 顶栏 */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3) var(--space-6);
  background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
}
.breadcrumb { font-size: var(--text-sm); color: #7A9FAA; font-weight: 500; }
.breadcrumb span { color: var(--sea-current); font-weight: 700; }
.top-bar-right { display: flex; align-items: center; gap: var(--space-3); }

/* 内容区 */
.content-area {
  flex: 1; overflow-y: auto; padding: var(--space-6) var(--space-8);
  scroll-behavior: smooth;
}

/* 页面过渡 */
.page-stage { transition: opacity 0.2s ease, transform 0.25s var(--ease-out); }
.page-stage.leaving { opacity: 0; transform: translateY(12px); }

/* ═══════════════════════════════════════
   组件
   ═══════════════════════════════════════ */

/* 毛玻璃卡片 */
.card {
  background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-radius: var(--r-lg); border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-card); padding: var(--space-6);
  transition: box-shadow var(--dur-normal) var(--ease-out),
              transform var(--dur-normal) var(--ease-out);
}
.card:hover { box-shadow: var(--shadow-card-h); }
.card--interactive:hover { transform: translateY(-2px); }

.card__header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-4);
}
.card__title {
  font-family: var(--font-display); font-size: var(--text-md);
  font-weight: 700; color: var(--sea-deep);
}

/* 统计小卡片 */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.stat-card {
  background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-radius: var(--r-md); border: 1px solid var(--glass-border);
  padding: var(--space-5); display: flex; align-items: center; gap: var(--space-4);
  transition: all var(--dur-normal) var(--ease-out); cursor: pointer;
}
.stat-card:hover { background: var(--glass-bg-heavy); transform: translateY(-2px); }
.stat-card__icon {
  width: 44px; height: 44px; border-radius: var(--r-sm);
  display: grid; place-items: center; font-size: 20px; flex-shrink: 0;
}
.stat-card__icon--blue  { background: rgba(26,107,128,0.10); }
.stat-card__icon--teal  { background: rgba(60,153,176,0.10); }
.stat-card__icon--green { background: rgba(93,170,134,0.10); }

.stat-card__info { min-width: 0; }
.stat-card__value {
  font-family: var(--font-display); font-size: 26px; font-weight: 800;
  color: var(--sea-deep); line-height: 1.1; letter-spacing: -0.5px;
}
.stat-card__label { font-size: var(--text-sm); color: #7A9FAA; font-weight: 500; margin-top: 2px; }

/* Hero 横幅 */
.page-hero {
  position: relative; border-radius: var(--r-lg);
  padding: var(--space-8); margin-bottom: var(--space-6);
  overflow: hidden;
  background: linear-gradient(135deg, rgba(26,107,128,0.10), rgba(93,170,134,0.08));
  border: 1px solid rgba(26,107,128,0.08);
}
.page-hero::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle 200px at 85% 20%, rgba(60,153,176,0.12), transparent),
    radial-gradient(circle 120px at 15% 80%, rgba(93,170,134,0.10), transparent);
}
.page-hero > * { position: relative; z-index: 1; }
.page-hero__title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 800; letter-spacing: -0.5px; }
.page-hero__subtitle { font-size: var(--text-base); color: #5A8795; margin-top: var(--space-2); }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: 8px 18px; border-radius: var(--r-full);
  font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600;
  cursor: pointer; border: 1.5px solid transparent; white-space: nowrap;
  transition: all var(--dur-fast) var(--ease-out);
  outline: none; user-select: none; line-height: 1.3;
}
.btn:active { transform: scale(0.96); }

.btn--primary {
  background: var(--sea-current); color: #fff;
  box-shadow: 0 2px 8px rgba(26,107,128,0.25);
}
.btn--primary:hover {
  background: var(--sea-reef);
  box-shadow: 0 4px 16px rgba(26,107,128,0.32);
}

.btn--glass {
  background: var(--glass-bg); border-color: var(--glass-border); color: var(--sea-current);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.btn--glass:hover { background: rgba(255,255,255,0.7); border-color: rgba(26,107,128,0.2); }

.btn--danger {
  background: rgba(229,135,111,0.10); border-color: rgba(229,135,111,0.25); color: var(--sea-coral);
}
.btn--danger:hover { background: rgba(229,135,111,0.18); }

.btn--sm { padding: 5px 14px; font-size: var(--text-xs); }
.btn--lg { padding: 11px 26px; font-size: var(--text-base); }

/* 标签 */
.tag {
  display: inline-flex; align-items: center; padding: 3px 10px;
  border-radius: var(--r-full); font-size: var(--text-xs); font-weight: 600;
}
.tag--blue  { background: rgba(26,107,128,0.10); color: var(--sea-current); }
.tag--teal  { background: rgba(60,153,176,0.10); color: #20758A; }
.tag--green { background: rgba(93,170,134,0.10); color: #3D7A5A; }
.tag--coral { background: rgba(229,135,111,0.10); color: #C5604A; }

/* 表格 */
.data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); }
.data-table th {
  text-align: left; padding: var(--space-3) var(--space-4);
  font-size: var(--text-xs); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.4px; color: #5A8795;
  border-bottom: 1.5px solid var(--glass-border);
  background: rgba(255,255,255,0.3);
}
.data-table th:first-child { border-radius: var(--r-sm) 0 0 0; }
.data-table th:last-child  { border-radius: 0 var(--r-sm) 0 0; }
.data-table td {
  padding: var(--space-3) var(--space-4); color: var(--sea-deep);
  border-bottom: 1px solid rgba(26,107,128,0.04);
}
.data-table tbody tr { transition: background var(--dur-fast) var(--ease-out); }
.data-table tbody tr:hover td { background: rgba(26,107,128,0.03); }

/* 输入框 */
.glass-input {
  width: 100%; padding: var(--space-3) var(--space-4); border-radius: var(--r-full);
  border: 1.5px solid rgba(26,107,128,0.15); background: var(--glass-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-size: var(--text-base); color: var(--sea-deep); font-family: var(--font-body);
  transition: all var(--dur-fast) var(--ease-out); outline: none;
}
.glass-input:focus {
  border-color: var(--sea-current);
  box-shadow: 0 0 0 3px rgba(26,107,128,0.10);
  background: rgba(255,255,255,0.75);
}
.glass-input::placeholder { color: #9AB8BF; }

/* 胶囊切换 */
.pill-tabs {
  display: flex; gap: 3px; padding: 3px;
  background: rgba(255,255,255,0.35); backdrop-filter: blur(8px);
  border-radius: var(--r-full); border: 1px solid var(--glass-border);
}
.pill-tab {
  padding: 6px 16px; border-radius: var(--r-full); font-size: var(--text-sm);
  font-weight: 600; color: #5A8795; cursor: pointer; border: none;
  background: transparent; transition: all var(--dur-fast) var(--ease-out);
}
.pill-tab.active { background: var(--sea-current); color: #fff; box-shadow: 0 2px 6px rgba(26,107,128,0.22); }

/* 进度条 */
.progress-bar {
  height: 6px; border-radius: 3px; background: rgba(26,107,128,0.08);
  overflow: hidden;
}
.progress-bar__fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--sea-current), var(--sea-reef));
  transition: width 0.6s var(--ease-out);
}

/* 弹窗 */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15,64,80,0.20); backdrop-filter: blur(6px);
  display: grid; place-items: center;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}
.modal-box {
  background: rgba(255,255,255,0.72); backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-radius: var(--r-lg); border: 1px solid var(--glass-border);
  box-shadow: 0 20px 50px rgba(15,64,80,0.12);
  min-width: 420px; max-width: 500px;
  animation: modalIn 0.35s var(--ease-spring);
}
@keyframes modalIn {
  0% { transform: scale(0.93) translateY(24px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
@keyframes fadeIn { from { opacity:0; } }
.modal-box__header { padding: var(--space-6) var(--space-6) var(--space-4); font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; }
.modal-box__body   { padding: 0 var(--space-6) var(--space-5); color: #4B7888; }
.modal-box__footer { padding: var(--space-3) var(--space-6) var(--space-6); display: flex; justify-content: flex-end; gap: var(--space-3); }

/* 代码块（日志/XPath） */
.code-block {
  background: rgba(15,64,80,0.04); border-radius: var(--r-sm);
  border: 1px solid rgba(26,107,128,0.06);
  padding: var(--space-3) var(--space-4); font-family: var(--font-mono);
  font-size: 12px; line-height: 1.6; color: var(--sea-deep);
  overflow-x: auto;
}

/* 功能类 */
.flex { display:flex; align-items:center; }
.flex-between { display:flex; align-items:center; justify-content:space-between; }
.gap-2 { gap:var(--space-2); } .gap-3 { gap:var(--space-3); } .gap-4 { gap:var(--space-4); }
.gap-6 { gap:var(--space-6); }
.mt-4 { margin-top:var(--space-4); } .mb-4 { margin-bottom:var(--space-4); }
.mb-6 { margin-bottom:var(--space-6); }
.text-muted { color:#7A9FAA; } .text-sm { font-size:var(--text-sm); }

/* ═══════════════════════════════════════
   响应式
   ═══════════════════════════════════════ */
@media (max-width: 900px) {
  .sidebar:not(.collapsed) { width: 200px; min-width: 200px; }
  .content-area { padding: var(--space-4); }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .sidebar { position: fixed; left: 0; z-index: 50;
    transform: translateX(0); transition: transform var(--dur-normal) var(--ease-out); }
  .sidebar.collapsed { transform: translateX(-100%); }
  .stat-grid { grid-template-columns: 1fr; }
}


/* ═══════════════════════════════════════
   暗色模式覆盖
   ═══════════════════════════════════════ */
@media (prefers-color-scheme: dark) {
  :root {
    --sea-spray:   #1A2B30;
    --sea-seafoam: #1B2E28;
    --sea-white:   #141E22;
    --glass-bg:       rgba(20,30,34,0.55);
    --glass-bg-heavy: rgba(20,30,34,0.72);
    --glass-border:   rgba(255,255,255,0.06);

   ═══════════════════════════════════════ */
const LABELS = {dashboard:'仪表盘',devices:'设备管理',elements:'元素定位',cases:'测试用例',runner:'执行引擎',reports:'测试报告',ai:'AI 助手'};

function navigate(el, page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('crumb').textContent = LABELS[page];

  const area = document.getElementById('content');
  area.classList.add('leaving');
  setTimeout(() => {
    area.innerHTML = PAGES[page];
    area.classList.remove('leaving');
    // 卡片逐项入场
    area.querySelectorAll('.stat-card, .card').forEach((c,i) => {
      c.style.opacity = '0'; c.style.transform = 'translateY(16px)'; c.style.transition = 'none';
      requestAnimationFrame(() => {
        c.style.transition = 'all 0.4s cubic-bezier(0.16,1,0.3,1)';
        c.style.opacity = '1'; c.style.transform = 'translateY(0)';
        c.style.transitionDelay = (i * 0.05) + 's';
      });
    });
    // 代码块延迟入场
    area.querySelectorAll('.code-block').forEach((c,i) => {
      c.style.opacity = '0'; c.style.transition = 'none';
      setTimeout(() => { c.style.transition = 'opacity 0.4s ease'; c.style.opacity = '1'; }, 300 + i*80);
    });
  }, 160);
}

// 初始加载
document.getElementById('content').innerHTML = PAGES.dashboard;
