<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蓝白绿流水主题 · 高保真原型</title>
<style>
/* ══════════════════════════════════════════════
   设计令牌 — 蓝白绿流水 · 毛玻璃 · 圆角体系
   ══════════════════════════════════════════════ */
:root {
  /* 主色 — 流水蓝 */
  --color-primary:        #4A90D9;
  --color-primary-light:  #7BB3E8;
  --color-primary-dark:   #2B6CB0;
  --color-primary-bg:     #EEF4FB;

  /* 辅助色 */
  --color-teal:           #5CB8B2;
  --color-teal-light:     #8ED5CF;
  --color-green:          #6BAF5A;
  --color-green-light:    #95CC88;

  /* 表面与背景 */
  --bg-root:              linear-gradient(160deg, #E8F4F8 0%, #DCE9F0 25%, #E2EEE8 55%, #F0F4F0 80%, #E6EEF5 100%);
  --bg-sidebar:           rgba(255,255,255,0.45);
  --bg-surface:           rgba(255,255,255,0.55);
  --bg-surface-hover:     rgba(255,255,255,0.78);
  --bg-card:              rgba(255,255,255,0.52);
  --bg-card-hover:        rgba(255,255,255,0.70);
  --bg-input:             rgba(255,255,255,0.65);

  /* 毛玻璃 */
  --glass-blur:           16px;
  --glass-border:         rgba(255,255,255,0.45);

  /* 文字 */
  --text-primary:         #1B3A4B;
  --text-regular:         #2C5062;
  --text-secondary:       #6B8A9A;
  --text-muted:           #94ADB8;
  --text-inverse:         #FFFFFF;

  /* 圆角体系 */
  --radius-sm:            10px;
  --radius-md:            16px;
  --radius-lg:            22px;
  --radius-xl:            28px;
  --radius-pill:          999px;

  /* 阴影 — 蓝调 */
  --shadow-xs:            0 2px 8px  rgba(74,144,217,0.06);
  --shadow-sm:            0 4px 16px rgba(74,144,217,0.10);
  --shadow-md:            0 8px 28px rgba(74,144,217,0.12);
  --shadow-lg:            0 16px 40px rgba(74,144,217,0.15);
  --shadow-glow-blue:     0 0 20px rgba(74,144,217,0.25);
  --shadow-glow-teal:     0 0 20px rgba(92,184,178,0.25);

  /* 侧边栏 */
  --sidebar-w:            230px;
  --sidebar-collapsed-w:  64px;

  /* 动效 */
  --ease-spring:          cubic-bezier(0.34,1.56,0.64,1);
  --ease-smooth:          cubic-bezier(0.4,0,0.2,1);
  --duration-fast:        0.18s;
  --duration-normal:      0.28s;
  --duration-slow:        0.45s;

  /* 字体 */
  --font-sans:            'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-display:         'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-root);
  background-size: 300% 300%;
  animation: flowBG 20s ease-in-out infinite;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════
   流水背景动画
   ═══════════════════════════════════════ */
@keyframes flowBG {
  0%   { background-position: 0% 50%; }
  25%  { background-position: 50% 30%; }
  50%  { background-position: 100% 60%; }
  75%  { background-position: 50% 80%; }
  100% { background-position: 0% 50%; }
}

/* 背景装饰气泡 */
.bg-bubbles {
  position: fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
}
.bubble {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(74,144,217,0.08));
  animation: floatUp linear infinite;
  opacity: 0;
}
@keyframes floatUp {
  0%   { transform: translateY(105vh) scale(0); opacity:0; }
  10%  { opacity:0.5; }
  90%  { opacity:0.1; }
  100% { transform: translateY(-10vh) scale(1.3); opacity:0; }
}

/* ═══════════════════════════════════════
   布局壳层
   ═══════════════════════════════════════ */
.app-shell {
  display: flex;
  height: 100vh;
  position: relative;
  z-index: 1;
}

/* ═══════════════════════════════════════
   侧边栏 — 毛玻璃 + 动画图标
   ═══════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100%;
  background: var(--bg-sidebar);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-right: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 10;
  transition: width var(--duration-normal) var(--ease-smooth),
              min-width var(--duration-normal) var(--ease-smooth);
  overflow: hidden;
}

.sidebar.collapsed {
  width: var(--sidebar-collapsed-w);
  min-width: var(--sidebar-collapsed-w);
}

/* 侧边栏品牌区 */
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 18px;
  border-bottom: 1px solid rgba(74,144,217,0.1);
  cursor: pointer;
  transition: padding var(--duration-normal) var(--ease-smooth);
}
.sidebar.collapsed .sidebar-brand { justify-content: center; padding: 20px 8px; }

.brand-icon {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--color-primary), var(--color-teal));
  display: grid; place-items: center;
  font-size: 20px;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(74,144,217,0.3);
  animation: brandPulse 3s ease-in-out infinite;
}
@keyframes brandPulse {
  0%,100% { box-shadow: 0 4px 12px rgba(74,144,217,0.3); }
  50%     { box-shadow: 0 4px 22px rgba(92,184,178,0.5); }
}

.brand-text { display: flex; flex-direction: column; white-space: nowrap; overflow: hidden; }
.brand-name {
  font-family: var(--font-display);
  font-size: 16px; font-weight: 800;
  background: linear-gradient(135deg, var(--color-primary), var(--color-teal));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: brandShimmer 3s linear infinite;
  background-size: 200% auto;
}
@keyframes brandShimmer {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}
.brand-sub {
  font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px;
}

/* 折叠按钮 */
.toggle-btn {
  position: absolute;
  top: 22px; right: -14px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid rgba(74,144,217,0.2);
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  color: var(--color-primary);
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  display: grid; place-items: center;
  z-index: 20;
  transition: all var(--duration-fast) var(--ease-smooth);
  box-shadow: var(--shadow-xs);
}
.toggle-btn:hover {
  background: var(--color-primary);
  color: #fff;
  border-color: var(--color-primary);
  box-shadow: var(--shadow-glow-blue);
}

/* 导航菜单 */
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 46px;
  border-radius: var(--radius-md);
  color: var(--text-regular);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all var(--duration-normal) var(--ease-spring);
  position: relative;
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar.collapsed .nav-item { justify-content: center; padding: 0; }

/* 导航项 — 活动指示器 */
.nav-item::before {
  content: '';
  position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 0;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--color-primary), var(--color-teal));
  transition: height var(--duration-normal) var(--ease-spring);
}
.nav-item:hover::before { height: 24px; }

/* 选中态 — 流光效果 */
.nav-item.active {
  background: linear-gradient(135deg, rgba(74,144,217,0.15), rgba(92,184,178,0.12));
  color: var(--color-primary-dark);
  box-shadow: inset 0 0 0 1.5px rgba(74,144,217,0.2),
              0 4px 16px rgba(74,144,217,0.12);
}
.nav-item.active::before { height: 32px; }

/* 选中态 — 光点闪烁 */
.nav-item.active::after {
  content: '';
  position: absolute;
  right: 12px; top: 50%; transform: translateY(-50%);
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--color-primary);
  box-shadow: 0 0 8px var(--color-primary-light);
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%,100% { opacity: 0.6; transform: translateY(-50%) scale(1); }
  50%     { opacity: 1;   transform: translateY(-50%) scale(1.4); }
}

/* 导航图标 */
.nav-icon {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 18px;
  transition: transform var(--duration-normal) var(--ease-spring);
}
.nav-item:hover .nav-icon  { transform: scale(1.15) rotate(-5deg); }
.nav-item.active .nav-icon { transform: scale(1.1); color: var(--color-primary); }

/* 图标 SVG 动画 */
.nav-icon svg {
  width: 20px; height: 20px;
  transition: all var(--duration-normal) var(--ease-smooth);
}
.nav-item.active .nav-icon svg { filter: drop-shadow(0 0 4px rgba(74,144,217,0.4)); }

.nav-label {
  flex: 1;
  transition: opacity var(--duration-fast) var(--ease-smooth);
}
.sidebar.collapsed .nav-label { opacity: 0; width: 0; }

/* 底部用户区 */
.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid rgba(74,144,217,0.1);
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.3);
}
.sidebar.collapsed .sidebar-footer { justify-content: center; padding: 14px 8px; }
.user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-teal), var(--color-primary));
  display: grid; place-items: center;
  color: #fff; font-size: 14px; font-weight: 700;
  flex-shrink: 0;
}
.user-info { display: flex; flex-direction: column; min-width: 0; }
.user-name { font-weight: 700; font-size: 13px; color: var(--text-primary); }
.user-role { font-size: 11px; color: var(--text-muted); }

/* ═══════════════════════════════════════
   主内容区
   ═══════════════════════════════════════ */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* 顶部栏 */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
}
.top-bar-left { display: flex; align-items: center; gap: 12px; }
.breadcrumb { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.breadcrumb span { color: var(--text-primary); }
.top-bar-right { display: flex; align-items: center; gap: 12px; }

/* 内容滚动区 */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  position: relative;
}

/* ═══════════════════════════════════════
   页面过渡动画
   ═══════════════════════════════════════ */
.page-enter-active {
  animation: pageIn var(--duration-slow) var(--ease-smooth);
}
@keyframes pageIn {
  0%   { opacity: 0; transform: translateY(20px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.page-leave-active {
  animation: pageOut var(--duration-normal) var(--ease-smooth);
}
@keyframes pageOut {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-12px) scale(0.99); }
}

/* ═══════════════════════════════════════
   毛玻璃卡片
   ═══════════════════════════════════════ */
.glass-card {
  background: var(--bg-card);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-radius: var(--radius-xl);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sm);
  padding: 24px;
  transition: all var(--duration-normal) var(--ease-smooth);
}
.glass-card:hover {
  background: var(--bg-card-hover);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.glass-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.glass-card__title {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 700;
  color: var(--text-primary);
}

/* 统计卡片网格 */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: all var(--duration-normal) var(--ease-smooth);
  cursor: pointer;
}
.stat-card:hover {
  background: var(--bg-card-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}
.stat-card__icon {
  width: 48px; height: 48px;
  border-radius: var(--radius-md);
  display: grid; place-items: center;
  font-size: 24px;
  flex-shrink: 0;
}
.stat-card__icon--blue  { background: linear-gradient(135deg, rgba(74,144,217,0.2), rgba(74,144,217,0.08)); }
.stat-card__icon--teal  { background: linear-gradient(135deg, rgba(92,184,178,0.2), rgba(92,184,178,0.08)); }
.stat-card__icon--green { background: linear-gradient(135deg, rgba(107,175,90,0.2), rgba(107,175,90,0.08)); }
.stat-card__info { display: flex; flex-direction: column; }
.stat-card__value { font-size: 28px; font-weight: 800; color: var(--text-primary); line-height:1.1; }
.stat-card__label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

/* ═══════════════════════════════════════
   毛玻璃按钮
   ═══════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 20px;
  border-radius: var(--radius-pill);
  font-weight: 700; font-size: 13px;
  font-family: var(--font-sans);
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all var(--duration-fast) var(--ease-spring);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  white-space: nowrap;
  user-select: none;
  outline: none;
}
.btn:active { transform: scale(0.96); }

.btn--primary {
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(74,144,217,0.3);
}
.btn--primary:hover {
  box-shadow: 0 6px 20px rgba(74,144,217,0.4);
  transform: translateY(-1px);
}

.btn--glass {
  background: rgba(255,255,255,0.5);
  border-color: rgba(74,144,217,0.2);
  color: var(--color-primary-dark);
}
.btn--glass:hover {
  background: rgba(255,255,255,0.8);
  border-color: var(--color-primary);
  box-shadow: var(--shadow-sm);
}

.btn--danger {
  background: rgba(232,95,95,0.12);
  border-color: rgba(232,95,95,0.3);
  color: #d44;
}
.btn--danger:hover {
  background: rgba(232,95,95,0.2);
  border-color: rgba(232,95,95,0.5);
}

.btn--sm { padding: 5px 14px; font-size: 12px; }
.btn--lg { padding: 12px 28px; font-size: 15px; }

/* ═══════════════════════════════════════
   毛玻璃输入框
   ═══════════════════════════════════════ */
.glass-input {
  width: 100%;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  border: 1.5px solid rgba(74,144,217,0.2);
  background: var(--bg-input);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 14px; color: var(--text-primary);
  font-family: var(--font-sans);
  transition: all var(--duration-fast) var(--ease-smooth);
  outline: none;
}
.glass-input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(74,144,217,0.12);
  background: rgba(255,255,255,0.8);
}
.glass-input::placeholder { color: var(--text-muted); }

/* ═══════════════════════════════════════
   毛玻璃标签
   ═══════════════════════════════════════ */
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 700;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.tag--blue  { background: rgba(74,144,217,0.12); color: var(--color-primary-dark); }
.tag--teal  { background: rgba(92,184,178,0.12); color: #3A8078; }
.tag--green { background: rgba(107,175,90,0.12); color: #4A7A3E; }

/* ═══════════════════════════════════════
   表格（毛玻璃风格）
   ═══════════════════════════════════════ */
.glass-table {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  font-size: 13px;
}
.glass-table th {
  text-align: left;
  padding: 12px 16px;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  border-bottom: 1.5px solid rgba(74,144,217,0.12);
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(8px);
}
.glass-table th:first-child { border-radius: var(--radius-md) 0 0 0; }
.glass-table th:last-child  { border-radius: 0 var(--radius-md) 0 0; }
.glass-table td {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(74,144,217,0.06);
  color: var(--text-regular);
}
.glass-table tr { transition: background var(--duration-fast) var(--ease-smooth); }
.glass-table tbody tr:hover td {
  background: rgba(74,144,217,0.04);
}

/* ═══════════════════════════════════════
   Tab 标签页
   ═══════════════════════════════════════ */
.glass-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(8px);
  border-radius: var(--radius-pill);
  border: 1px solid rgba(74,144,217,0.1);
  width: fit-content;
}
.tab-item {
  padding: 7px 18px;
  border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 700;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-spring);
  border: none; background: transparent;
  white-space: nowrap;
}
.tab-item.active {
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: #fff;
  box-shadow: 0 2px 8px rgba(74,144,217,0.3);
}

/* ═══════════════════════════════════════
   弹窗（毛玻璃）
   ═══════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(27,58,75,0.25);
  backdrop-filter: blur(4px);
  display: grid; place-items: center;
  z-index: 100;
  animation: fadeIn var(--duration-normal) var(--ease-smooth);
}
@keyframes fadeIn { from { opacity: 0; } }
.modal-box {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: var(--radius-xl);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 520px;
  animation: modalIn var(--duration-slow) var(--ease-spring);
}
@keyframes modalIn {
  0%   { transform: scale(0.92) translateY(30px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
.modal-box__header {
  padding: 20px 24px 16px;
  font-size: 18px; font-weight: 700;
  color: var(--text-primary);
}
.modal-box__body { padding: 0 24px 16px; }
.modal-box__footer {
  padding: 12px 24px 20px;
  display: flex; justify-content: flex-end; gap: 10px;
}

/* ═══════════════════════════════════════
   页面标题 Hero
   ═══════════════════════════════════════ */
.page-hero {
  background: linear-gradient(135deg, rgba(74,144,217,0.15), rgba(92,184,178,0.1));
  border-radius: var(--radius-xl);
  padding: 28px 32px;
  margin-bottom: 24px;
  border: 1px solid rgba(74,144,217,0.12);
  position: relative;
  overflow: hidden;
}
.page-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(74,144,217,0.15), transparent);
  pointer-events: none;
}
.page-hero::after {
  content: '';
  position: absolute;
  bottom: -30px; left: 40%;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(92,184,178,0.12), transparent);
  pointer-events: none;
}
.page-hero__title {
  font-size: 24px; font-weight: 800;
  color: var(--text-primary);
  position: relative; z-index: 1;
}
.page-hero__subtitle {
  font-size: 14px; color: var(--text-secondary);
  margin-top: 6px;
  position: relative; z-index: 1;
}

/* ═══════════════════════════════════════

.section-title {
  font-size: 15px; font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: '';
  width: 4px; height: 18px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--color-primary), var(--color-teal));
}

/* Utilities */
.flex-row { display:flex; align-items:center; gap:12px; }
.flex-between { display:flex; align-items:center; justify-content:space-between; }
.gap-8  { gap:8px; }
.gap-16 { gap:16px; }
.gap-24 { gap:24px; }
.mt-16 { margin-top:16px; }
.mb-16 { margin-bottom:16px; }
.text-muted { color: var(--text-muted); }
.text-sm { font-size:12px; }

/* 响应式 */

  .stat-grid { grid-template-columns: repeat(2, 1fr); }

function switchPage(el, page) {
