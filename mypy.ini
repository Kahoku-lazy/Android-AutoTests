# mypy + django-stubs
# Usage: python -m mypy apps/

[mypy]
python_version = 3.13
plugins =
    mypy_django_plugin.main
ignore_missing_imports = True
warn_unused_ignores = True
show_error_codes = True
pretty = True
exclude = migrations|__pycache__|tests
check_untyped_defs = False
disallow_untyped_defs = False

[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-agentscope.*]
ignore_errors = True

# AgentScope SDK stubs lag runtime APIs (SecretStr / MCPClient / ToolResponse)
[mypy-apps.ai_assistant.agent_scope.*]
ignore_errors = True

[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-uiautomator2.*]
ignore_missing_imports = True

[mypy-airtest.*]
ignore_missing_imports = True
