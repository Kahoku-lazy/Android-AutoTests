components:
  schemas:
    ApiKeyEnvEnum:
      enum:
      - DEEPSEEK_API_KEY
      - DASHSCOPE_API_KEY
      - GOVEE_API_KEY
      type: string
      description: |-
        * `DEEPSEEK_API_KEY` - DEEPSEEK_API_KEY
        * `DASHSCOPE_API_KEY` - DASHSCOPE_API_KEY
        * `GOVEE_API_KEY` - GOVEE_API_KEY
    ApiProtocolEnum:
      enum:
      - deepseek
      - dashscope
      - openai
      type: string
      description: |-
        * `deepseek` - deepseek
        * `dashscope` - dashscope
        * `openai` - openai
    AssistantInput:
      type: object
      description: 助手名片入参。头像字节由视图解码后传入写库层。
      properties:
        display_name:
          type: string
          maxLength: 200
        role_id:
          type: string
          maxLength: 11
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
    AssistantOutput:
      type: object
      description: 助手列表出参。不下发头像正文。
      properties:
        assistant_id:
          type: string
        display_name:
          type: string
        has_avatar:
          type: boolean
          readOnly: true
        marker:
          type: string
        role_id:
          type: string
        role_name:
          type: string
          readOnly: true
        tools: {}
        created_at:
          type: string
          format: date-time
      required:
      - assistant_id
      - created_at
      - display_name
      - has_avatar
      - marker
      - role_id
      - role_name
      - tools
    CaseSourceEnum:
      enum:
      - yaml
      - platform
      type: string
      description: |-
        * `yaml` - yaml
        * `platform` - platform
    Login:
      type: object
      properties:
        username:
          type: string
          default: ''
        password:
          type: string
          default: ''
    ModelConfig:
      type: object
      description: 模型配置入参与出参。只校验字段形状，不创建模型。
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        api_protocol:
          $ref: '#/components/schemas/ApiProtocolEnum'
        model_kind:
          allOf:
          - $ref: '#/components/schemas/ModelKindEnum'
          default: chat
        voice:
          type: string
          maxLength: 64
        api_key_env:
          $ref: '#/components/schemas/ApiKeyEnvEnum'
        base_url:
          type: string
          maxLength: 500
        model_name:
          type: string
          maxLength: 100
      required:
      - api_key_env
      - api_protocol
      - id
      - provider
    ModelKindEnum:
      enum:
      - chat
      - tts
      - realtime
      type: string
      description: |-
        * `chat` - chat
        * `tts` - tts
        * `realtime` - realtime
    ModuleWrite:
      type: object
      description: 新增模块入参。
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 200
        data_dir:
          type: string
          maxLength: 500
        enabled:
          type: boolean
          default: true
      required:
      - data_dir
      - description
      - name
    PatchedAssistantInput:
      type: object
      description: 助手名片入参。头像字节由视图解码后传入写库层。
      properties:
        display_name:
          type: string
          maxLength: 200
        role_id:
          type: string
          maxLength: 11
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
    PatchedBugStatusInput:
      type: object
      description: Body for PATCH /api/bugs/{id}/.
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
    PatchedModelConfig:
      type: object
      description: 模型配置入参与出参。只校验字段形状，不创建模型。
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        api_protocol:
          $ref: '#/components/schemas/ApiProtocolEnum'
        model_kind:
          allOf:
          - $ref: '#/components/schemas/ModelKindEnum'
          default: chat
        voice:
          type: string
          maxLength: 64
        api_key_env:
          $ref: '#/components/schemas/ApiKeyEnvEnum'
        base_url:
          type: string
          maxLength: 500
        model_name:
          type: string
          maxLength: 100
    PatchedModulePatch:
      type: object
      description: 编辑模块入参（至少一个字段）。
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 200
        data_dir:
          type: string
          maxLength: 500
        enabled:
          type: boolean
    PatchedRoleInput:
      type: object
      description: Agent 配置入参。不查模型配置是否存在。
      properties:
        name:
          type: string
          maxLength: 200
        model_config_id:
          type: integer
          minimum: 1
        system_prompt:
          type: string
    PatchedSopWorkflowInput:
      type: object
      description: 新建 SOP 工作流入参。只收名称与两个名片编号。
      properties:
        name:
          type: string
          maxLength: 200
        executor_assistant_id:
          type: string
          maxLength: 12
        verifier_assistant_id:
          type: string
          maxLength: 12
    ProviderEnum:
      enum:
      - deepseek
      - dashscope
      - govee
      type: string
      description: |-
        * `deepseek` - deepseek
        * `dashscope` - dashscope
        * `govee` - govee
    Query:
      type: object
      description: 多选提问入参：问题与勾选库名均非空。
      properties:
        question:
          type: string
        bases:
          type: array
          items:
            type: string
        top_k:
          type: integer
          minimum: 1
      required:
      - bases
      - question
    Refresh:
      type: object
      properties:
        refresh_token:
          type: string
          default: ''
    Register:
      type: object
      properties:
        username:
          type: string
          default: ''
        password:
          type: string
          default: ''
        password2:
          type: string
          default: ''
        email:
          type: string
          default: ''
    RoleInput:
      type: object
      description: Agent 配置入参。不查模型配置是否存在。
      properties:
        name:
          type: string
          maxLength: 200
        model_config_id:
          type: integer
          minimum: 1
        system_prompt:
          type: string
    RoleOutput:
      type: object
      description: Agent 配置出参。关联字段由写库层 select_related 后交给这里。
      properties:
        role_id:
          type: string
        name:
          type: string
        model_config_id:
          type: integer
          nullable: true
        provider:
          type: string
          default: ''
        api_key_env:
          type: string
          default: ''
        model_name:
          type: string
          default: ''
        base_url:
          type: string
          default: ''
        api_protocol:
          type: string
          default: ''
        system_prompt:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - model_config_id
      - name
      - role_id
      - system_prompt
      - updated_at
    SopWorkflowInput:
      type: object
      description: 新建 SOP 工作流入参。只收名称与两个名片编号。
      properties:
        name:
          type: string
          maxLength: 200
        executor_assistant_id:
          type: string
          maxLength: 12
        verifier_assistant_id:
          type: string
          maxLength: 12
      required:
      - executor_assistant_id
      - name
      - verifier_assistant_id
    SopWorkflowOutput:
      type: object
      description: 工作流出参。不下发提示词、模型参数或工具勾选。
      properties:
        id:
          type: integer
        name:
          type: string
        executor_assistant_id:
          type: string
        verifier_assistant_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - executor_assistant_id
      - id
      - name
      - updated_at
      - verifier_assistant_id
    StatusEnum:
      enum:
      - open
      - resolved
      - ignored
      type: string
      description: |-
        * `open` - open
        * `resolved` - resolved
        * `ignored` - ignored
    TaskSubmitInput:
      type: object
      description: |-
        任务提交入参 — title/agent_id 必填；设备由任务类型在视图层校验。

        device_control 任务必须有 device_serial，用例来源二选一：``yaml`` 上传配置
        文件，或 ``platform`` 给用例编号列表（JSON 数组字符串）。case_authoring 任务
        必须上传 documents（PRD/Word），不需要设备与 YAML。
      properties:
        title:
          type: string
        workflow_id:
          type: integer
          minimum: 1
        agent_id:
          type: integer
          minimum: 1
        device_serial:
          type: string
          default: ''
        case_title:
          type: string
          default: ''
        case_source:
          allOf:
          - $ref: '#/components/schemas/CaseSourceEnum'
          default: yaml
        case_ids:
          type: string
          default: ''
        goal:
          type: string
          default: ''
        assistant_route:
          type: string
          default: ''
        device_label:
          type: string
          default: ''
        attachment:
          type: string
          format: uri
          nullable: true
      required:
      - title
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: dashboard
  description: 仪表盘：全平台只读聚合统计
- name: devices
  description: 设备管理：扫描 / 连接 / 断开 / 激活 / 心跳 / 占用释放
- name: cases
  description: 用例管理：项目 → 目录 → 文件 → 用例行
- name: auth
  description: 登录鉴权：登录 / 注册 / 刷新 / 登出 / 当前用户
- name: ai
  description: AI 助手：智能体配置、任务发布 / 重跑 / 取消、任务清单
- name: tasks
  description: 任务清单：任务提交、重跑、取消、事件流程报告
- name: bugs
  description: BUG 单管理：任务错误分类登记、检索与处理状态
- name: reports
  description: 测试报告：已生成报告台账（SOP + 智能体）、报告数量统计
- name: serial-log
  description: 串口日志：端口监听开关、当前日志查看与关键词对照表
- name: ops
  description: 运营后台：账号列表 / 停用启用 / 重置密码
- name: schema
  description: OpenAPI schema 端点（drf-spectacular 自带）
