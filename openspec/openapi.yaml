components:
  schemas:
    AssistantInput:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 200
        role_id:
          type: string
          maxLength: 11
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
        revision:
          type: integer
    AssistantOutput:
      type: object
      properties:
        assistant_id:
          type: string
        display_name:
          type: string
        has_avatar:
          type: boolean
          readOnly: true
        marker:
          type: string
        role_id:
          type: string
        role_name:
          type: string
          readOnly: true
        tools: {}
        release_state:
          type: string
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - assistant_id
      - created_at
      - display_name
      - has_avatar
      - marker
      - release_state
      - revision
      - role_id
      - role_name
      - tools
    EvalTrigger:
      type: object
      properties:
        module_id:
          type: integer
        model_config_id:
          type: integer
        pos_count:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
        neg_count:
          type: integer
          maximum: 100
          minimum: 0
          default: 10
      required:
      - model_config_id
      - module_id
    Login:
      type: object
      properties:
        username:
          type: string
          default: ''
        password:
          type: string
          default: ''
    ModelConfig:
      type: object
      properties:
        id:
