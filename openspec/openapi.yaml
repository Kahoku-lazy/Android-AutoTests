components:
  schemas:
    AgentDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
        tags:
          type: string
        description:
          type: string
        model_provider:
          type: string
        model_name:
          type: string
        vision_model_name:
          type: string
        strong_model_name:
          type: string
        strong_enabled:
          type: boolean
        api_key:
          type: string
          readOnly: true
        base_url:
          type: string
          readOnly: true
        route_configs:
          type: object
          additionalProperties: {}
          readOnly: true
        max_loops:
          type: integer
        status:
          type: string
        created_at:
          type: string
      required:
      - api_key
      - avatar
      - base_url
      - created_at
      - description
      - id
      - max_loops
      - model_name
      - model_provider
      - name
      - route_configs
      - status
      - strong_enabled
      - strong_model_name
      - tags
      - vision_model_name
    DocTypeEnum:
      enum:
      - page_flow
      type: string
      description: '* `page_flow` - 页面流'
    Login:
      type: object
      properties:
        username:
          type: string
          default: ''
        password:
          type: string
          default: ''
    PatchedWorkflowDirectory:
      type: object
      description: 目录序列化器 — 含文档数量.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        prototype_id:
          type: integer
          readOnly: true
        parent_id:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        doc_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedWorkflowDocumentDetail:
      type: object
      description: 文档详情 — 含 config_json（前端字段名 config，读写均支持）.
      properties:
        id:
          type: integer
          readOnly: true
        doc_id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 500
        doc_type:
          $ref: '#/components/schemas/DocTypeEnum'
        prototype_id:
          type: integer
          readOnly: true
        directory_id:
          type: integer
          nullable: true
        description:
          type: string
        config: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedWorkflowPrototype:
      type: object
      description: 原型序列化器 — 含文档数量.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        doc_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Refresh:
      type: object
      properties:
        refresh_token:
          type: string
          default: ''
    Register:
      type: object
      properties:
        username:
          type: string
          default: ''
        password:
          type: string
          default: ''
        password2:
          type: string
          default: ''
        email:
          type: string
          default: ''
    TaskSubmitInput:
      type: object
      description: |-
        任务提交入参 — title/agent_id/device_serial 必填；case_title 可选。

        旧字段 goal / assistant_route / attachment 保留为可选，仅兼容历史客户端；
        执行链不再使用它们。
      properties:
        title:
          type: string
        agent_id:
          type: integer
          minimum: 1
        device_serial:
          type: string
        case_title:
          type: string
          default: ''
        goal:
          type: string
          default: ''
        assistant_route:
          type: string
          default: ''
        device_label:
          type: string
          default: ''
        attachment:
          type: string
          format: uri
          nullable: true
      required:
      - agent_id
      - device_serial
      - title
    WorkflowDirectory:
      type: object
      description: 目录序列化器 — 含文档数量.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        prototype_id:
          type: integer
          readOnly: true
        parent_id:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        doc_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - doc_count
      - id
      - name
      - parent_name
      - prototype_id
      - updated_at
    WorkflowDocumentDetail:
      type: object
      description: 文档详情 — 含 config_json（前端字段名 config，读写均支持）.
      properties:
        id:
          type: integer
          readOnly: true
        doc_id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 500
        doc_type:
          $ref: '#/components/schemas/DocTypeEnum'
        prototype_id:
          type: integer
          readOnly: true
        directory_id:
          type: integer
          nullable: true
        description:
          type: string
        config: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - doc_id
      - doc_type
      - id
      - prototype_id
      - title
      - updated_at
    WorkflowDocumentList:
      type: object
      description: 文档列表 — 不含 config_json（体积大）.
      properties:
        id:
          type: integer
          readOnly: true
        doc_id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 500
        doc_type:
          $ref: '#/components/schemas/DocTypeEnum'
        prototype_id:
          type: integer
          readOnly: true
        directory_id:
          type: integer
          nullable: true
          readOnly: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - directory_id
      - doc_id
      - doc_type
      - id
      - prototype_id
      - title
      - updated_at
    WorkflowPrototype:
      type: object
      description: 原型序列化器 — 含文档数量.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        doc_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - doc_count
      - id
      - name
      - updated_at
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: dashboard
  description: 仪表盘：全平台只读聚合统计
- name: devices
  description: 设备管理：扫描 / 连接 / 断开 / 激活 / 心跳 / 占用释放
- name: cases
  description: 用例管理：项目 → 目录 → 文件 → 用例行
- name: workflow
  description: 页面流：原型目录、画布文档 CRUD 与导入导出
- name: auth
  description: 登录鉴权：登录 / 注册 / 刷新 / 登出 / 当前用户
- name: ai
  description: AI 助手：智能体配置、任务发布 / 重跑 / 取消、任务清单
- name: tasks
  description: 任务清单：任务提交、重跑、取消、事件流程报告
- name: reports
  description: 测试报告：任务报告列表、用例分解、报告文件下载与查看
- name: serial-log
  description: 串口日志：端口监听开关、当前日志查看与关键词对照表
- name: schema
  description: OpenAPI schema 端点（drf-spectacular 自带）
