openapi: 3.0.3
info:
  title: Android-AutoTests API
  version: 2.0.0
  description: Android UI 自动化测试平台 — 覆盖设备管理、文档式用例、AI 任务执行与验收、串口日志、测试报告与仪表盘。
paths:
  /api/ai/agent-reports/{run}/{name}/:
    get:
      operationId: ai_agent_reports_retrieve
      description: GET /api/ai/agent-reports/{run}/{name}/ — 只读平台报告正文。
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      - in: path
        name: run
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/assistants/:
    get:
      operationId: ai_assistants_list
      description: 助手名片 — /api/ai/assistants/ 与 /api/ai/assistants/{assistant_id}/。
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssistantOutput'
          description: ''
    post:
      operationId: ai_assistants_create
      description: 助手名片 — /api/ai/assistants/ 与 /api/ai/assistants/{assistant_id}/。
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantInput'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantInput'
          description: ''
  /api/ai/assistants/{assistant_id}/:
    get:
      operationId: ai_assistants_retrieve
      description: 助手名片 — /api/ai/assistants/ 与 /api/ai/assistants/{assistant_id}/。
      parameters:
      - in: path
        name: assistant_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantOutput'
          description: ''
    patch:
      operationId: ai_assistants_partial_update
      description: 助手名片 — /api/ai/assistants/ 与 /api/ai/assistants/{assistant_id}/。
      parameters:
      - in: path
        name: assistant_id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssistantInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssistantInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssistantInput'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantInput'
          description: ''
    delete:
      operationId: ai_assistants_destroy
      description: 助手名片 — /api/ai/assistants/ 与 /api/ai/assistants/{assistant_id}/。
      parameters:
      - in: path
        name: assistant_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/assistants/{assistant_id}/avatar/:
    get:
      operationId: ai_assistants_avatar_retrieve
      description: GET /api/ai/assistants/{assistant_id}/avatar/ — 只返回压缩后的头像正文。
      parameters:
      - in: path
        name: assistant_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/assistants/{assistant_id}/threads/:
    get:
      operationId: ai_assistant_threads_list
      description: 测试对话栏：建栏、列表、发送、轮询、取消。发送只落库并排队，不在请求里跑模型。
      parameters:
      - in: path
        name: assistant_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: ai_assistant_threads_create
      description: 测试对话栏：建栏、列表、发送、轮询、取消。发送只落库并排队，不在请求里跑模型。
      parameters:
      - in: path
        name: assistant_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/assistants/threads/{thread_id}/:
    get:
      operationId: ai_assistant_thread_detail
      description: GET 轮询消息；POST 发送；PATCH 重命名；DELETE 取消。
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: ai_assistant_thread_send
      description: GET 轮询消息；POST 发送；PATCH 重命名；DELETE 取消。
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: ai_assistants_threads_partial_update
      description: GET 轮询消息；POST 发送；PATCH 重命名；DELETE 取消。
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: ai_assistants_threads_destroy
      description: GET 轮询消息；POST 发送；PATCH 重命名；DELETE 取消。
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/assistants/threads/{thread_id}/delete/:
    post:
      operationId: ai_assistants_threads_delete_create
      description: |-
        POST /api/ai/assistants/threads/{thread_id}/delete/ — 删除对话栏与其消息。

        进行中的轮次先请求取消，再删记录；后台线程写回时发现栏已不存在会跳过。
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/assistants/threads/{thread_id}/logs/:
    get:
      operationId: ai_assistant_thread_logs_list
      description: 列出该栏日志，或用 ticket 打开一份 HTML。report_id 为空时只列目录。
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: ai_assistant_thread_log_ticket
      description: 列出该栏日志，或用 ticket 打开一份 HTML。report_id 为空时只列目录。
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/assistants/threads/{thread_id}/logs/{report_id}/:
    get:
      operationId: ai_assistant_thread_log_file
      description: 用一次性 ticket 打开一份已写完的 HTML 日志。只挂带 report_id 的路径。
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
        required: true
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
                format: binary
          description: ''
    post:
      operationId: ai_assistants_threads_logs_create
      description: 用一次性 ticket 打开一份已写完的 HTML 日志。只挂带 report_id 的路径。
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
        required: true
      - in: path
        name: thread_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/model-configs/:
    get:
      operationId: ai_model_configs_list
      description: 模型配置 — /api/ai/model-configs/。登录可读，运营可写。
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelConfig'
          description: ''
    post:
      operationId: ai_model_configs_create
      description: 模型配置 — /api/ai/model-configs/。登录可读，运营可写。
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModelConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModelConfig'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfig'
          description: ''
  /api/ai/model-configs/{id}/:
    get:
      operationId: ai_model_configs_retrieve
      description: 模型配置 — /api/ai/model-configs/。登录可读，运营可写。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 模型配置 的 唯一整数值。
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfig'
          description: ''
    patch:
      operationId: ai_model_configs_partial_update
      description: 模型配置 — /api/ai/model-configs/。登录可读，运营可写。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 模型配置 的 唯一整数值。
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedModelConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedModelConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedModelConfig'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfig'
          description: ''
    delete:
      operationId: ai_model_configs_destroy
      description: 模型配置 — /api/ai/model-configs/。登录可读，运营可写。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 模型配置 的 唯一整数值。
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/model-configs/discover/:
    post:
      operationId: ai_model_configs_discover_create
      description: POST /api/ai/model-configs/discover/ — 向厂商查询模型名，不写库。
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModelConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModelConfig'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/roles/:
    get:
      operationId: ai_roles_list
      description: 角色增删改查 — /api/ai/roles/ 与 /api/ai/roles/{role_id}/。
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleOutput'
          description: ''
    post:
      operationId: ai_roles_create
      description: 角色增删改查 — /api/ai/roles/ 与 /api/ai/roles/{role_id}/。
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleInput'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInput'
          description: ''
  /api/ai/roles/{role_id}/:
    get:
      operationId: ai_roles_retrieve
      description: 角色增删改查 — /api/ai/roles/ 与 /api/ai/roles/{role_id}/。
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleOutput'
          description: ''
    patch:
      operationId: ai_roles_partial_update
      description: 角色增删改查 — /api/ai/roles/ 与 /api/ai/roles/{role_id}/。
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleInput'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInput'
          description: ''
    delete:
      operationId: ai_roles_destroy
      description: 角色增删改查 — /api/ai/roles/ 与 /api/ai/roles/{role_id}/。
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/sop-workflows/:
    get:
      operationId: ai_sop_workflows_list
      description: GET/POST /api/ai/sop-workflows/ — 列出与创建 SOP 工作流。
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SopWorkflowOutput'
          description: ''
    post:
      operationId: ai_sop_workflows_create
      description: GET/POST /api/ai/sop-workflows/ — 列出与创建 SOP 工作流。
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SopWorkflowInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SopWorkflowInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SopWorkflowInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SopWorkflowOutput'
          description: ''
  /api/ai/sop-workflows/{workflow_id}/:
    patch:
      operationId: ai_sop_workflows_partial_update
      description: |-
        PATCH/DELETE /api/ai/sop-workflows/{workflow_id}/ — 编辑或删除一条工作流。

        编辑与创建共用同一份入参与校验；删除只删工作流记录，
        名片、Agent 配置与历史任务都不受影响。
      parameters:
      - in: path
        name: workflow_id
        schema:
          type: integer
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSopWorkflowInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSopWorkflowInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSopWorkflowInput'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SopWorkflowOutput'
          description: ''
    delete:
      operationId: ai_sop_workflows_destroy
      description: |-
        PATCH/DELETE /api/ai/sop-workflows/{workflow_id}/ — 编辑或删除一条工作流。

        编辑与创建共用同一份入参与校验；删除只删工作流记录，
        名片、Agent 配置与历史任务都不受影响。
      parameters:
      - in: path
        name: workflow_id
        schema:
          type: integer
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/tool-catalog/:
    get:
      operationId: ai_tool_catalog_retrieve
      description: GET /api/ai/tool-catalog/ — 只读工具目录，不含实现。
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/auth/login — 账号密码正确则发本次会话。
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/auth/logout — 作废这次登录。服务暂不可用时拒绝登出。
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET /api/auth/me — 当前登录用户，含是否管理员。
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: POST /api/auth/refresh — 用续期凭证换新的访问凭证，仍属同一次登录。
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: POST /api/auth/register — 创建用户并直接登录。用户名已有则拒绝。
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
