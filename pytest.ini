[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers --alluredir=tests/allure-results

markers =
    # 测试层级
    unit: 单元测试 — 纯逻辑，零 I/O
    integration: 集成测试 — Django ORM + 多模块协作
    api: 接口测试 — HTTP 端点 + 鉴权
    ui: UI 测试 — 真实浏览器
    e2e: 端到端 — 真实设备/完整链路
    slow: 慢速测试 (> 1s)
    # 业务模块 (用于筛选)
    auth: 登录鉴权 (JWT/Token/Key/登录页)
    platform_shell: 平台框架 (侧边栏/路由/布局/主题)
    dashboard: 仪表盘
    device_pool: 设备管理
    element_locator: 元素定位
    case_manager: 用例管理
    test_runner: 执行引擎
    report_generator: 测试报告
    ai_assistant: AI助手
    workflow: 工作流
    avatar: 数字人
    evaluator: 评估器
    # 架构契约 (跨模块不变量)
    arch: 架构契约测试 — 通信通道 / 依赖边界不变量
