[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers --nomigrations

markers =
    # ── 三层测试分层（主 marker，各自独立执行）──
    api: 接口测试 — 黑盒 HTTP 端点 + 鉴权（live server）
    unit: 单元测试 — 灰盒·纯逻辑，零 I/O 零 DB
    integration: 集成测试 — 灰盒·Django ORM + 多模块协作（django_db）
    e2e: 端到端测试 — 黑盒·真实浏览器/设备完整链路
    arch: 架构契约测试 — 跨模块不变量（保留 tests/arch）
    slow: 慢速测试（> 1s）
    # ── 业务模块（辅助筛选）──
    auth: 登录鉴权
    device_pool: 设备管理
    device_inspector: 设备检查器
    element_locator: 元素定位
    case_manager: 用例管理
    report_generator: 测试报告
    ai_assistant: AI 助手
    workflow: 工作流
    evaluator: 评估器
