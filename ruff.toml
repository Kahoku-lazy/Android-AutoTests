# Ruff configuration — Android-AutoTests
# Encodes the team Python conventions (backend/apps/AGENTS.md §1) as automated checks.
# Run: ruff check .        (lint)
# Run: ruff format .       (format)
# Run: ruff check --fix .  (auto-fix)

line-length = 100
target-version = "py313"

# ── File scope ──────────────────────────────────────────
exclude = [
    "**/migrations/*",
    "**/__pycache__/*",
    ".venv/*",
    "node_modules/*",
    # vendored skill-creator 脚手架（.agents/skills 与 engines/agents/skills 两份拷贝）：
    # 供应商产物，不适用本项目 lint 规范，改了会在下次 skill 更新时丢失
    ".agents/skills/skill-creator/**",
    "engines/agents/skills/**/skill-creator/**",
    # 同上：skill-creator 已随 skills 数据迁到 config/data/skills 下
    "engines/agents/config/data/skills/**/skill-creator/**",
    # 外部 skill 整目录：供应商产物，不按本仓库 lint 改
    ".agents/skills/stylekit-skill/**",
]

# ── Formatter ──────────────────────────────────────────
[format]
# §11: 双引号 (Q000)
quote-style = "double"
indent-style = "space"
# §11: 尾随逗号 (COM812)
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Linter ─────────────────────────────────────────────
[lint]
select = [
    # ─ §3: Import 顺序 stdlib → 第三方 → 项目 (I001)
    "I",
    # ─ §3: 禁止 from module import * (F403, F405)
    "F403",
    "F405",
    # ─ §3: 禁止未使用的 import (F401) 与赋值了没用的变量 (F841)
    "F401",
    "F841",
    # ─ §3: 禁止"用了却没导入的名字" (F821)：模块漏 import 只会在运行期才炸，
    #   历史上真出过（模型调试台装配函数调用了未导入的 build_device_models），故纳入门禁。
    "F821",
    # ─ §8: 禁止裸 except: (E722)
    "E722",
    # ─ except 里再 raise 必须带 from，避免异常链断掉 (B904)
    "B904",
    # ─ §11: 禁止 print() (T201)
    "T201",
    # ─ §11: 双引号 (Q000)
    "Q",
    # ─ 禁止用字符串拼接拼 SQL (S608)
    "S608",
]

# ── isort 配置 (§3 import 顺序) ────────────────────────
[lint.isort]
known-first-party = ["backend", "engines", "utils"]
lines-between-types = 1
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# ── 忽略特定规则 ───────────────────────────────────────
[lint.per-file-ignores]
# ─ management/commands: 允许 print() 输出
"**/management/commands/*.py" = ["T201"]
# ─ CLI 入口 / 种子脚本: 允许 print() 输出
"run.py" = ["T201"]
# utils/ 下只有这四个是 CLI 脚本（utils/logs.py 是库，不放开 print）
"utils/{check_gates,gen_arch_stats,check_openapi_coverage,live_screen,module_docstring}.py" = ["T201"]
# ─ engines AGENTS style checker (skill scripts CLI): allow print()
".agents/skills/engines-agents-style-check/scripts/check_engines_agents_style.py" = ["T201"]
# ─ engines docstring 读写 CLI（同一类技能脚本）: allow print()
".agents/skills/engines-docstring-check/scripts/*.py" = ["T201"]
# ─ Django 6.1 文档读写 CLI（同一类技能脚本）: allow print()
".agents/skills/django-61-docs/scripts/*.py" = ["T201"]
".agents/skills/agentscope-docs/scripts/*.py" = ["T201"]
# ─ repo-viz-board 技能的数据生成 CLI 模板: 控制台输出，属 CLI 而非库代码
".agents/skills/repo-viz-board/assets/template/gen_data.template.py" = ["T201"]
# ─ dev_docs 可视化看板的侧边栏同步 CLI: 同上
"dev_docs/project-viz/tools/sync_sidebar.py" = ["T201"]
# ─ Omni 本地 S2S 演示入口（run_local_s2s / main）: 用 print 输出，属 CLI 而非库代码
"engines/agents/realtime_vocie_agent.py" = ["T201"]
"engines/agents/realtime_vocie/demo.py" = ["T201"]
# ─ ae_harness 原型链的角色入口与 SOP 入口: 交互式控制台输出，属 CLI 而非库代码
#   _bootstrap 是这几个入口共用的打印骨架（汇总 / 异常），本身也只服务 CLI
"engines/ae_harness/assistant/_bootstrap.py" = ["T201"]
# ─ 知识库探针（index / retrieve）与模块自测入口：控制台工具，非库代码
"engines/ae_harness/knowledge/probe.py" = ["T201"]
# ─ tests/: 放宽限制
"tests/**/*.py" = ["T201"]
# ─ __init__.py: 允许未使用 import (re-export)
"**/__init__.py" = ["F401"]
# ─ apps.py / admin.py: 不要求模块 docstring
"**/apps.py" = ["D100"]
"**/admin.py" = ["D100"]
# ─ settings.py / test_settings.py: 允许 *
"backend/config/settings.py" = ["F403", "F405"]
"tests/test_settings.py" = ["F403", "F405"]
# ─ conftest.py
"**/conftest.py" = ["D100"]
# ─ state_machine.py::_bg_sync → 延迟追溯，豁免裸 except
# (仅标记，不在此处忽略 E722，留给代码 review 判断)
