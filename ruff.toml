# Ruff configuration — Android-AutoTests
# Run: ruff check .        (lint)
# Run: ruff format .       (format)
# Run: ruff check --fix .  (auto-fix)

line-length = 100
target-version = "py313"

# ── File scope ──────────────────────────────────────────
exclude = [
    "**/migrations/*",
    "**/__pycache__/*",
    ".venv/*",
    "node_modules/*",
    ".agents/skills/skill-creator/**",
    "engines/agents/skills/**/skill-creator/**",
    "engines/agents/config/data/skills/**/skill-creator/**",
    ".agents/skills/stylekit-skill/**",
]

# ── Formatter ──────────────────────────────────────────
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Linter ─────────────────────────────────────────────
[lint]
select = [
    "I",
    "F403",
    "F405",
    "F401",
    "F841",
    "F821",
    "E722",
    "B904",
    "T201",
    "Q",
    "S608",
]

# ── isort ──────────────────────────────────────────────
[lint.isort]
known-first-party = ["backend", "engines", "utils"]
lines-between-types = 1
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# ── per-file-ignores ───────────────────────────────────
[lint.per-file-ignores]
"**/management/commands/*.py" = ["T201"]
"run.py" = ["T201"]
"utils/service_ctl/*.py" = ["T201"]
"utils/{check_gates,gen_arch_stats,check_openapi_coverage,live_screen,module_docstring}.py" = ["T201"]
".agents/skills/engines-agents-style-check/scripts/check_engines_agents_style.py" = ["T201"]
".agents/skills/engines-docstring-check/scripts/*.py" = ["T201"]
".agents/skills/django-61-docs/scripts/*.py" = ["T201"]
".agents/skills/agentscope-docs/scripts/*.py" = ["T201"]
".agents/skills/repo-viz-board/assets/template/gen_data.template.py" = ["T201"]
"dev_docs/project-viz/tools/sync_sidebar.py" = ["T201"]
"engines/agents/realtime_vocie_agent.py" = ["T201"]
"engines/agents/realtime_vocie/demo.py" = ["T201"]
"engines/ae_harness/assistant/_bootstrap.py" = ["T201"]
"engines/ae_harness/knowledge/probe.py" = ["T201"]
"tests/**/*.py" = ["T201"]
"**/__init__.py" = ["F401"]
"**/apps.py" = ["D100"]
"**/admin.py" = ["D100"]
"backend/config/settings.py" = ["F403", "F405"]
"tests/test_settings.py" = ["F403", "F405"]
"**/conftest.py" = ["D100"]