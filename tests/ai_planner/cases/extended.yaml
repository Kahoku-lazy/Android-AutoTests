# 规划模型能力评测 —— 扩展用例集（按需指定，不默认跑）
#
# 正式口径只有 planner.yaml 的两条（单步 / 多步，模型用 deepseek-flash）；
# 本文件收录更难的场景，用于按需深度评测：
#   python manage.py planner_eval --cases tests/ai_planner/cases/extended.yaml --repeat 1 --tag extended
#
# 字段说明同 planner.yaml。

cases:
  - id: named-device
    title: 指定设备名（不得中途换目标）
    goal: 打开 govee 应用并进入 H6810 设备详情页
    expect:
      must_contain: ["govee", "H6810"]
      steps_min: 2
      steps_max: 5
      require_flow_tool: true

  - id: with-attachment
    title: 需求要点来自附件文本
    goal: 按附件要求操作设备
    input: json
    attach: 进入 H6810 设备详情页后，打开「音乐模式」页面
    device: ""
    expect:
      must_contain: ["音乐"]
      steps_min: 2
      steps_max: 6
      require_flow_tool: true

  - id: json-four-keys
    title: 四键 JSON 输入（含设备ID）
    goal: 打开 govee 应用并进入设备主页
    input: json
    attach: ""
    device: RF8N21MSW7A
    expect:
      must_contain: ["govee"]
      steps_min: 2
      steps_max: 4
      require_flow_tool: true

  - id: log-check-step
    title: 开关类断言（应标需要日志核对）
    goal: 打开 govee 应用，进入 H6810 设备详情页，关闭设备开关
    expect:
      must_contain: ["H6810"]
      steps_min: 2
      steps_max: 6
      require_flow_tool: true
      expect_mixed_log_check: true

  - id: vague-demand
    title: 模糊需求（测它会不会瞎猜）
    goal: 帮我看看设备
    expect:
      must_contain: []
      steps_min: 1
      steps_max: 6
      require_flow_tool: true

  # 以下两条来自真实测试点文档 logs/01/H6810自动化测试点.md（该目录被 .gitignore 覆盖，
  # 故测试点原文逐字内联在此，保证用例自包含、可复现）。
  # 输入用四键 JSON 的「附件文本内容」承载测试点文档 —— 与生产消费 Word/PDF 测试点的方式一致。

  - id: classic-page-functions
    title: 经典页面功能测试（H6810 卡片页）
    goal: 按附件中的测试点，完成 H6810 设备卡片页「经典页面」的功能测试
    input: json
    attach: |
      经典页面功能测试：
      1. 长按H6810设备卡片页，选择经典，点击保存成功。
      2. 点击经典卡片页上的开关OFF/ON，日志断言是否开关成功。
      3. 检查经典卡片页上WIFI&蓝牙 图标显示正确。
    device: ""
    expect:
      # 只取不可能被同义改写的硬事实；WIFI/蓝牙的写法会被改写，故不入关键词
      must_contain: ["H6810", "经典", "开关"]
      steps_min: 3
      steps_max: 12
      require_flow_tool: true
      # 该组测试点天然混合两类断言（开关→日志断言、图标→页面断言），故要求 log_check 有区分度
      expect_mixed_log_check: true

  - id: dynamic-page-functions
    title: 灵动页面功能测试（H6810 卡片页）
    goal: 按附件中的测试点，完成 H6810 设备卡片页「灵动页面」的功能测试
    input: json
    attach: |
      灵动页面功能测试：
      1. 长按H6810设备卡片页，选择灵动，点击保存成功
      2. 检查灵动卡片页上WIFI&蓝牙 图标显示正确。
      3. 点击灵动卡片页上的开关OFF/ON，日志断言是否开关成功。
    device: ""
    expect:
      must_contain: ["H6810", "灵动", "开关"]
      steps_min: 3
      steps_max: 12
      require_flow_tool: true
      expect_mixed_log_check: true
