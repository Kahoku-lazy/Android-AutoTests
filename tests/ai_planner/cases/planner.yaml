# 规划模型能力评测 —— 正式口径用例集（只跑这两条）
#
# 正式口径（用户指定）：**只用 deepseek-flash 模型**、**只跑单步与多步两条**。
# 更难的场景（四键 JSON / 附件 / 指定设备名 / 需日志核对 / 模糊需求）见同目录 extended.yaml，
# 按需用 --cases 指定，不默认跑。
#
# 字段说明：
#   id / title / goal  —— 用例标识 / 短标题 / 需求文本（goal 必填）
#   input              —— text（默认）| json（规格规定的四键中文 JSON；可带 attach / device）
#   expect:            —— 机械可判的期望
#     must_contain     —— 必须出现在计划步骤里的关键词（硬性）
#     steps_min / max  —— 步骤数区间（硬性）
#     require_flow_tool—— 是否要求调用页面流工具（硬性；默认 true）
#     expect_mixed_log_check —— 是否要求 log_check 出现混合取值（硬性）

cases:
  - id: single-step
    title: 单步需求
    goal: 打开 govee 应用
    expect:
      must_contain: ["govee"]
      steps_min: 1
      steps_max: 2
      require_flow_tool: true

  - id: multi-step
    title: 多步需求（启动应用 + 页面跳转）
    goal: 启动 govee 应用并进入设备列表
    expect:
      must_contain: ["govee"]
      steps_min: 2
      steps_max: 4
      require_flow_tool: true
