# ── 参数校验：capture 非法 method / 空 serial / 未注册 serial ──

- id: "TC-INS-010"
  name: "capture-invalid-method"
  title: "抓取非法 method"
  point: "method=both（已废弃）返回 400 无效的获取方法"
  auth: "required"
  method: "POST"
  path: "/api/inspector/capture"
  body:
    serial: "emulator-5554"
    method: "both"
  expect:
    status: 400
    schema: "error"
    check:
      message: "无效的获取方法"

- id: "TC-INS-011"
  name: "capture-empty-serial"
  title: "抓取未选设备"
  point: "serial 为空返回 409 未选择设备，请先连接设备"
  auth: "required"
  method: "POST"
  path: "/api/inspector/capture"
  body:
    serial: ""
    method: "dump"
  expect:
    status: 409
    schema: "error"
    check:
      message: "未选择设备，请先连接设备"

- id: "TC-INS-012"
  name: "capture-unregistered-serial"
  title: "抓取未注册设备"
  point: "serial 不在设备池返回 409 设备未注册"
  auth: "required"
  method: "POST"
  path: "/api/inspector/capture"
  body:
    serial: "no_such_serial_xyz"
    method: "dump"
  expect:
    status: 409
    schema: "error"
    check:
      message: "设备未注册"

