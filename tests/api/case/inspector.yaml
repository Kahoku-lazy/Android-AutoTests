# 设备检查器接口用例（黑盒，保持约定：鉴权 / 参数校验 / 404/400 错误路径）
# 抓取成功等需真实设备的路径，留给集成测试与真机验证
# 字段：id / name / title / point / method|path / body / auth(none=无token, required=带token) / expect(status|schema|check)

# ── 鉴权：7 端点无 token → 401 ──

- id: "TC-INS-001"
  name: "capture-no-token"
  title: "快照抓取未登录"
  point: "无 Bearer token 访问 capture，返回 401 请先登录"
  auth: "none"
  method: "POST"
  path: "/api/inspector/capture"
  body:
    serial: "emulator-5554"
    method: "dump"
  expect:
    status: 401
    schema: "error"
    check:
      message: "请先登录"

