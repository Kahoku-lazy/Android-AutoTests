# POST /api/auth/login 单接口用例
# 字段：id 编号 / name 英文短名(node id) / title 测试标题 / point 测试点 / method|path 请求 / body|raw_body 请求体 / expect 期望(status|schema|check)
- id: "TC-LOGIN-001"
  name: "login-success"
  title: "正常登录"
  point: "输入正确的用户名密码，返回访问/刷新令牌对与用户信息"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "admin"
    password: "admin123"
  expect:
    status: 200
    schema: "auth_success"
    check:
      data.user.username: "admin"

- id: "TC-LOGIN-003"
  name: "empty-username-and-password"
  title: "用户名和密码均为空"
  point: "两者都为空时后端拦截，返回 400 与提示文案"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: ""
    password: ""
  expect:
    status: 400
    schema: "error"
    check:
      message: "请输入用户名和密码"

- id: "TC-LOGIN-004"
  name: "empty-username"
  title: "用户名为空"
  point: "用户名为空、密码非空时，返回 400 提示请输入用户名"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: ""
    password: "pass123"
  expect:
    status: 400
    schema: "error"
    check:
      message: "请输入用户名"

- id: "TC-LOGIN-005"
  name: "empty-password"
  title: "密码为空"
  point: "用户名非空、密码为空时，返回 400 提示请输入密码"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "admin"
    password: ""
  expect:
    status: 400
    schema: "error"
    check:
      message: "请输入密码"

- id: "TC-LOGIN-006"
  name: "whitespace-username"
  title: "用户名为纯空白"
  point: "用户名全为空格时，返回 400 提示用户名不能为空白"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "   "
    password: "pass123"
  expect:
    status: 400
    schema: "error"
    check:
      message: "用户名不能为空白"

- id: "TC-LOGIN-007"
  name: "username-too-long"
  title: "用户名超过150字符"
  point: "用户名长度超限（151），返回 400 与长度提示"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    password: "pass123"
  expect:
    status: 400
    schema: "error"
    check:
      message: "用户名过长，最多150个字符"

- id: "TC-LOGIN-013"
  name: "wrong-password"
  title: "密码错误"
  point: "密码错误时统一返回 401 用户名或密码错误（防枚举）"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "admin"
    password: "wrong-password"
  expect:
    status: 401
    schema: "error"
    check:
      message: "用户名或密码错误"

- id: "TC-LOGIN-014"
  name: "user-not-exist"
  title: "用户不存在"
  point: "用户名不存在时统一返回 401 用户名或密码错误（防枚举）"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "no_such_user"
    password: "pass123"
  expect:
    status: 401
    schema: "error"
    check:
      message: "用户名或密码错误"

- id: "TC-LOGIN-012"
  name: "invalid-json"
  title: "JSON 格式非法"
  point: "请求体非合法 JSON，返回 400 请求格式错误"
  method: "POST"
  path: "/api/auth/login/"
  raw_body: "not a json"
  expect:
    status: 400
    schema: "error"
    check:
      message: "请求格式错误"

- id: "TC-LOGIN-015"
  name: "username-with-spaces"
  title: "账号前后带空格"
  point: "账号不 trim：带首尾空格的账号按原样核对，返回 401 而不是匹配到 admin（守护 trim_whitespace=False）"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "  admin  "
    password: "admin123"
  expect:
    status: 401
    schema: "error"
    check:
      message: "用户名或密码错误"

- id: "TC-LOGIN-016"
  name: "password-with-spaces"
  title: "密码前后带空格"
  point: "密码走 DRF CharField 默认 trim：首尾空格被去掉后仍能登录成功（与注册侧 strip 一致，两侧口径相同）"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "admin"
    password: "  admin123  "
  expect:
    status: 200
    schema: "auth_success"
    check:
      data.user.username: "admin"

- id: "TC-LOGIN-017"
  name: "json-array-body"
  title: "请求体是 JSON 数组"
  point: "非对象请求体兜底：返回 400 而非 500（文案由框架生成，不做逐字断言）"
  method: "POST"
  path: "/api/auth/login/"
  raw_body: "[1, 2]"
  expect:
    status: 400
    schema: "error"

- id: "TC-LOGIN-018"
  name: "public-endpoint-without-auth"
  title: "公开端点不带 Authorization"
  point: "登录属公开端点：请求不带 Authorization 头也应正常签发令牌（网关公开路径白名单生效）"
  method: "POST"
  path: "/api/auth/login/"
  body:
    username: "admin"
    password: "admin123"
  expect:
    status: 200
    schema: "auth_success"
    check:
      data.user.username: "admin"
