- id: "TC-REG-011"
  name: "password-mismatch"
  title: "两次密码不一致"
  point: "password 与 password2 不一致时，返回 400 提示两次密码不一致"
  method: "POST"
  path: "/api/auth/register"
  body:
    username: "{{unique_username}}"
    password: "pass123"
    password2: "pass456"
    email: "a@b.com"
  expect:
    status: 400
    schema: "error"
    check:
      message: "两次密码不一致"

