- id: "TC-REG-020"
  name: "username-exists"
  title: "用户名已存在"
  point: "用户名已被占用时，返回 409 提示用户名已存在"
  method: "POST"
  path: "/api/auth/register"
  body:
    username: "admin"
    password: "pass123"
    password2: "pass123"
    email: "a@b.com"
  expect:
    status: 409
    schema: "error"
    check:
      message: "用户名已存在"
