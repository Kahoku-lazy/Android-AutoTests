[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=./allure-results
    --html=./report.html
    --self-contained-html
markers =
    smoke: Quick smoke tests for basic sanity
    navigation: Page switching and routing tests
    api: API integration tests
    functional: Functional logic tests
    slow: Slow running tests
