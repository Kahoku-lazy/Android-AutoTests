[pytest]
DJANGO_SETTINGS_MODULE = tests.test_settings
# testpaths 相对 rootdir；temps/ 等非测试目录的排除见 norecursedirs
testpaths = .
# temps/ 只放临时/归档用例，绝不参与收集（temps 在仓库根下，默认扫描会命中）
norecursedirs = temps .* build dist node_modules venv *.egg __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers --nomigrations

markers =
    # ── 测试分层（主 marker，各自独立执行；口径见 tests/AGENTS.md）──
    api: 灰盒（接口）— 功能链路 HTTP 端点 + 鉴权（live server）
    unit: 契约守护 — 只给 tests/arch/unit 用；业务单元测试已迁出，禁止新增
    integration: 灰盒（服务层）— Django ORM + 多模块协作（django_db）
    e2e: 浏览器 b2b — Playwright 真实浏览器交互与提示词/弹窗断言
    arch: 架构契约测试 — 跨模块不变量（保留 tests/arch）
    perf: 页面加载性能预算 — 真实浏览器取 Navigation Timing / LCP（需运行中的前端，PERF_RUN=1 显式开启）
    asyncio: 异步用例，由 pytest-asyncio 执行
    slow: 慢速测试（> 1s）
    # ── 业务模块（辅助筛选）──
    auth: 登录鉴权
    device_pool: 设备管理
    device_inspector: 设备检查器
    element_locator: 元素定位
    case_manager: 用例管理
    report_generator: 测试报告
    ai_assistant: AI 助手
